# Deliberately weak: TLS 1.0/1.1 and CBC/3DES/other legacy suites.
# SECLEVEL=0 is what lets OpenSSL offer them at all.
server {
    listen 80;
    listen 443 ssl;
    server_name nginx-legacy.stand.test;
    ssl_certificate     /certs/nginx-legacy.crt;
    ssl_certificate_key /certs/nginx-legacy.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ALL:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;
    location / { root /usr/share/nginx/html; }
}
