# Minimal, fast, internet-free config for the end-to-end CI scan.
# Targets a single container, scans port 80, runs default NSE scripts + -sV.
runtime:
  mode: safe
  retries: 1
  timeout_seconds: 300
  nse_timeout_seconds: 180
  per_run_output: false

profiles:
  safe:
    discover_rate: 1000
    port_rate: 1000
    top_ports: 100
    pulse:
      rate: 2000
      concurrency: 500
  balanced:
    discover_rate: 1000
    port_rate: 1000
    top_ports: 100
    pulse:
      rate: 2000
      concurrency: 500
  fast:
    discover_rate: 1000
    port_rate: 1000
    top_ports: 100
    pulse:
      rate: 2000
      concurrency: 500

batching:
  enabled: true
  ipv4_prefix: 24
  max_targets_per_batch: 256

discovery:
  source: naabu
  profile: custom            # e2e: do not apply mode presets (fast CI scan)
  skip_discovery: false

ports:
  source: naabu
  custom_ports_file: scanner/inputs/ports.txt

reporting:
  markdown_summary: true
  html_summary: true
  csv_export: true
  json_export: true
