# Accepted, documented vulnerability exceptions for the Trivy CI gate.
# The non-blocking "Trivy report" step does NOT use this file, so these still
# show up in CI logs for visibility.
#
# Every exception carries an `expired_at` review date. Once that date passes
# Trivy stops honouring the entry and the gate goes red again — that is the
# intended reminder, not a regression. When one fires: re-check whether an
# upstream release now carries the fix, bump the pin if it does, and only
# extend the date (with a fresh justification) if it still does not.

vulnerabilities:
  # Go stdlib crypto/tls: incorrect certificate validation during TLS session
  # resumption. Present in the upstream dnsx/naabu Go binaries (compiled with
  # Go < 1.24.13). We already pin the latest available releases (dnsx 1.2.3,
  # naabu 2.6.1); no fixed tool release exists yet. Out of our control until
  # ProjectDiscovery rebuilds with patched Go — revisit and bump the pins then.
  - id: CVE-2025-68121
    statement: >-
      Unfixable from our side: the affected code is Go's stdlib baked into the
      upstream dnsx/naabu binaries. Pins are already at the latest releases;
      resolved only by a ProjectDiscovery rebuild on Go >= 1.24.13.
    expired_at: 2026-12-07

  # golang.org/x/crypto/ssh (GO-2026-6303): the source-address critical option
  # was not enforced for Permissions returned by password, keyboard-interactive,
  # no-client-auth and GSSAPI callbacks. Fixed in x/crypto 0.55.0. The affected
  # symbols are ssh.NewServerConn / serverAuthenticate — the SSH *server* side.
  # Present in all three Go binaries (dnsx 1.2.3 carries 0.45.0, naabu 2.6.1
  # 0.46.0, nuclei v3.11.1 0.53.0), all as an indirect dependency, and none of
  # them accepts an SSH connection: nuclei has an SSH client for templates,
  # dnsx and naabu never touch the package. No upstream release carries the fix
  # as of 2026-09-02 (dnsx 1.3.1 of 2026-08-31 is on 0.52.0, nuclei 3.11.1 is
  # the latest). Revisit and bump the pins when one does; do NOT extend this
  # exception to any client-side x/crypto/ssh advisory.
  - id: CVE-2026-56854
    statement: >-
      Server-side only (ssh.NewServerConn / serverAuthenticate); the bundled
      dnsx, naabu and nuclei binaries never accept an SSH connection. Indirect
      dependency in all three, and no upstream release ships x/crypto >= 0.55.0
      yet. Does not cover client-side x/crypto/ssh advisories.
    expired_at: 2026-12-07

# GHSA-r277-6w6q-xmqw (kin-openapi fail-open auth bypass) is NOT ignored here:
# nuclei v3.11.1 pins kin-openapi 0.144.0, which carries the fix, and that is
# the version the nuclei-build stage compiles (see Dockerfile ARG
# NUCLEI_VERSION). Do not re-add it as an exception — bump nuclei instead.
