[package]
name = "pulse"
version = "0.2.0"
edition = "2021"
description = "A sleek, modern async network & open-port scanner"
license = "MIT"
authors = ["GenA"]
readme = "README.md"
keywords = ["network", "port-scanner", "security", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive", "color"] }
comfy-table = "7.2.2"
crossterm = "0.29.0"
futures = "0.3.33"
indicatif = "0.18.6"
ipnet = "2.12.0"
libc = "0.2.189"
owo-colors = "4.3.0"
pnet = "0.35.0"
rand = "0.10.2"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
