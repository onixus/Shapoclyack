apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/part-of: shapoclyack
  name: shapoclyack-postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/name: shapoclyack
  serviceName: shapoclyack-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: shapoclyack
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          value: shapoclyack
        - name: POSTGRES_USER
          value: octo
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "shapoclyack.secretName" (dict "root" $ "key" "postgres" "default" "shapoclyack-postgres") }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: {{ include "shapoclyack.image" .Values.images.postgres }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - octo
            - -d
            - shapoclyack
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 20
        name: postgres
        ports:
        - containerPort: 5432
          name: client
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - octo
            - -d
            - shapoclyack
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
{{- toYaml .Values.resources.postgres | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        - mountPath: /var/run/postgresql
          name: run
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 1Mi
        name: run
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: shapoclyack
      name: postgres-data
    spec:
{{- with .Values.storage.postgres.storageClass }}
      storageClassName: {{ . | quote }}
{{- end }}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.storage.postgres.size }}
