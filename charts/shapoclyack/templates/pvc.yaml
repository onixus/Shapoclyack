apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/part-of: shapoclyack
  name: scanner-data
  namespace: {{ .Release.Namespace }}
spec:
{{- with .Values.storage.scannerData.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
  accessModes:
  - {{ .Values.storage.scannerData.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.scannerData.size }}
