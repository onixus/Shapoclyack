{{- if include "shapoclyack.generateSecret" (dict "root" $ "key" "api") }}
apiVersion: v1
data:
  jwt_secret: {{ "shapoclyack-dev-secret-change-me" | b64enc }}
kind: Secret
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: shapoclyack
  name: {{ include "shapoclyack.secretName" (dict "root" $ "key" "api" "default" "shapoclyack-api") }}
  namespace: {{ .Release.Namespace }}
type: Opaque
{{- end }}
