apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: clickhouse
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/part-of: shapoclyack
  name: shapoclyack-clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: clickhouse
      app.kubernetes.io/name: shapoclyack
  serviceName: shapoclyack-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/component: clickhouse
        app.kubernetes.io/name: shapoclyack
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: CLICKHOUSE_DB
          value: shapoclyack
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "shapoclyack.secretName" (dict "root" $ "key" "clickhouse" "default" "shapoclyack-clickhouse") }}
        - name: CLICKHOUSE_BACKUP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "shapoclyack.secretName" (dict "root" $ "key" "clickhouseBackup" "default" "shapoclyack-clickhouse-backup") }}
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: "0"
        image: {{ include "shapoclyack.image" .Values.images.clickhouse }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        name: clickhouse
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        - containerPort: 9009
          name: interserver
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
{{- toYaml .Values.resources.clickhouse | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/clickhouse-server/users.d
          name: users-d
        - mountPath: /var/lib/clickhouse
          name: clickhouse-data
        - mountPath: /etc/clickhouse-server/config.d/shapoclyack-config.xml
          name: config
          readOnly: true
          subPath: config.xml
        - mountPath: /etc/clickhouse-server/users.d/shapoclyack-users.xml
          name: config
          readOnly: true
          subPath: users.xml
        - mountPath: /docker-entrypoint-initdb.d/init.sql
          name: config
          readOnly: true
          subPath: init.sql
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: shapoclyack-clickhouse-config
        name: config
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - emptyDir:
          sizeLimit: 1Mi
        name: users-d
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/component: clickhouse
        app.kubernetes.io/name: shapoclyack
      name: clickhouse-data
    spec:
{{- with .Values.storage.clickhouse.storageClass }}
      storageClassName: {{ . | quote }}
{{- end }}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.storage.clickhouse.size }}
