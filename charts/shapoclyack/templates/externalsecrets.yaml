{{- /*
Optional ExternalSecrets Operator objects, one per Secret the workloads read.
Same store layout as k8s/shapoclyack/examples/externalsecret.example.yaml:
<remoteKeyPrefix>/<path>, property <name>. creationPolicy Owner means ESO owns
the whole Secret: list every key the workload needs (the api-users Secret with
the master key and console bootstrap is not covered here, see docs/helm.md).
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- $es := .Values.externalSecrets }}
{{- $items := list
  (dict "key" "api" "name" "shapoclyack-api" "component" "api" "path" "api" "ns" $root.Release.Namespace "fields" (list (list "jwt_secret" "jwt_secret")))
  (dict "key" "postgres" "name" "shapoclyack-postgres" "component" "postgres" "path" "postgres" "ns" $root.Release.Namespace "fields" (list (list "password" "password")))
  (dict "key" "clickhouse" "name" "shapoclyack-clickhouse" "component" "clickhouse" "path" "clickhouse" "ns" $root.Release.Namespace "fields" (list (list "password" "password")))
  (dict "key" "clickhouseBackup" "name" "shapoclyack-clickhouse-backup" "component" "clickhouse-backup" "path" "clickhouse-backup" "ns" $root.Release.Namespace "fields" (list (list "password" "password")))
  (dict "key" "nats" "name" "shapoclyack-nats" "component" "nats" "path" "nats" "ns" $root.Release.Namespace "fields" (list (list "api_password" "api_password") (list "agent_password" "agent_password")))
  (dict "key" "postgresBackupS3" "name" "shapoclyack-backup" "component" "backup" "path" "backup" "ns" $root.Release.Namespace "fields" (list (list "access_key_id" "access_key_id") (list "secret_access_key" "secret_access_key") (list "region" "region") (list "bucket" "bucket") (list "prefix" "prefix") (list "endpoint_url" "endpoint_url")))
  (dict "key" "clickhouseBackupS3" "name" "shapoclyack-clickhouse-backup-s3" "component" "clickhouse-backup" "path" "clickhouse-backup-s3" "ns" $root.Release.Namespace "fields" (list (list "access_key_id" "access_key_id") (list "secret_access_key" "secret_access_key") (list "region" "region") (list "bucket" "bucket") (list "prefix" "prefix") (list "endpoint_url" "endpoint_url")))
  (dict "key" "scannerExecutor" "name" "shapoclyack-scanner-executor" "component" "scanner-executor" "path" "scanner-executor" "ns" $root.Values.namespaces.executor.name "fields" (list (list "provisioning_key" "provisioning_key") (list "agent_id_prefix" "agent_id_prefix")))
}}
{{- range $items }}
{{- $override := index $root.Values.existingSecrets .key }}
{{- if not $override }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .ns }}
  labels:
    app.kubernetes.io/component: {{ .component }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/part-of: shapoclyack
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- $path := .path }}
    {{- range .fields }}
    - secretKey: {{ index . 0 }}
      remoteRef:
        key: {{ $es.remoteKeyPrefix }}/{{ $path }}
        property: {{ index . 1 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
