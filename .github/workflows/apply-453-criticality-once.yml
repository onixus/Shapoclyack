# Temporary branch-only edit transport. Remove before this PR is ready for review.
# No checkout, external actions, arbitrary inputs, or writes to the default branch.
name: Apply verified issue 453 edit
on:
  push:
    branches: ['fix/453-scan-risk-criticality']
    paths: ['.github/workflows/apply-453-criticality-once.yml']
permissions:
  contents: write
concurrency:
  group: apply-453-criticality-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'onixus/Shapoclyack' && github.ref == 'refs/heads/fix/453-scan-risk-criticality'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply exactly one reviewed argument to the pinned source blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          root = 'https://api.github.com/repos/onixus/Shapoclyack'
          branch = 'fix/453-scan-risk-criticality'
          path = 'api/services/vulnerabilities.py'
          expected = '1b2fc53886f8b4597938c28d8104036dfbbcdc59'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          def request(url, data=None):
              req = urllib.request.Request(
                  url, headers=headers,
                  data=json.dumps(data).encode() if data is not None else None,
                  method='PUT' if data is not None else 'GET',
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          record = request(root + '/contents/' + path + '?ref=' + branch)
          if record['sha'] != expected:
              raise SystemExit('Source blob changed; refusing to overwrite it')
          source = base64.b64decode(record['content'])
          blob = b'blob ' + str(len(source)).encode() + b'\0' + source
          if hashlib.sha1(blob).hexdigest() != expected:
              raise SystemExit('Source blob integrity check failed')
          before = (
              b'            scored = scorer.score_vulnerability(\n'
              b'                entry,\n'
              b'                operator_exposure=asset.exposure_level,\n'
          )
          after = (
              b'            scored = scorer.score_vulnerability(\n'
              b'                entry,\n'
              b'                asset_criticality_override=asset.asset_criticality,\n'
              b'                operator_exposure=asset.exposure_level,\n'
          )
          if source.count(before) != 1:
              raise SystemExit('Expected exactly one matching scan-fold call')
          updated = source.replace(before, after, 1)
          result = request(root + '/contents/' + path, {
              'message': 'fix(risk): honor operator asset criticality in scan fold (#453)',
              'branch': branch,
              'sha': expected,
              'content': base64.b64encode(updated).decode('ascii'),
          })
          print('Updated only ' + path + ': ' + result['commit']['sha'])
          PY
