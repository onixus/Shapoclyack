name: Docker Publish

# ОТКЛЮЧЕНО: заменено локальным Jenkins (Jenkinsfile.publish, джоба
# shapoclyack-publish). Образы по-прежнему уезжают в ghcr.io — лимит у нас на
# минуты раннеров, а не на реестр, поэтому деплой и k8s-манифесты не меняются.
# Автоматические триггеры сняты; ручной запуск оставлен.
# Вернуть: раскомментировать push/release ниже.
#
# Подпись (#313): образ пушится по digest без тега, подписывается keyless —
# сертификатом Fulcio на OIDC-идентичность этого workflow, — получает
# подписанную аттестацию SLSA provenance, проверяется так же, как его будет
# проверять клиент, и только потом получает теги. Всё это делает
# scripts/sign-release-image.sh, общий с Jenkinsfile.publish. Идентичность,
# которую проверяют клиенты и политики допуска, —
#   https://github.com/onixus/Shapoclyack/.github/workflows/docker-publish.yml@refs/tags/<тег релиза>
# поэтому релизный прогон запускается с тега («Use workflow from» → тег);
# прогон с ветки подписывается тоже, но политики его не пропустят.
# Сторонние actions здесь закреплены по SHA коммита: у этого job есть
# id-token: write, то есть право подписывать от имени проекта, и
# переставленный чужой тег получил бы его вместе с job.
on:
  # push:
  #   tags: ["v*"]
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (optional, e.g. test)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  # Fulcio certificate for keyless signing. `attestations: write` is gone:
  # provenance is a cosign attestation in the registry, next to the image,
  # not a GitHub attestation.
  id-token: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Container packages are Shapoclyack-scoped (the legacy octo-man GHCR package is gone).
          # Default scanner/aio images ship Pulse-only (no Nmap) -- see issue #97:
          # Nmap's NPSL license makes bundling it in the default distributed
          # artifacts a redistribution risk. A second `-nmap` tag is published
          # alongside for anyone who explicitly wants the legacy NSE path.
          - name: scanner
            dockerfile: Dockerfile
            image: ghcr.io/onixus/shapoclyack-scanner
            install_nmap: "0"
            tag_suffix: ""
          - name: scanner-nmap
            dockerfile: Dockerfile
            image: ghcr.io/onixus/shapoclyack-scanner
            install_nmap: "1"
            tag_suffix: "-nmap"
          - name: api
            dockerfile: Dockerfile.api
            image: ghcr.io/onixus/shapoclyack-api
            install_nmap: "0"
            tag_suffix: ""
          - name: aio
            dockerfile: Dockerfile.allinone
            image: ghcr.io/onixus/shapoclyack-aio
            install_nmap: "0"
            tag_suffix: ""
          - name: aio-nmap
            dockerfile: Dockerfile.allinone
            image: ghcr.io/onixus/shapoclyack-aio
            install_nmap: "1"
            tag_suffix: "-nmap"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          # The emulator that runs the arm64 half of the build, pinned like
          # any other image the build runs (#313).
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # The BuildKit daemon builds the image and writes its provenance.
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      # The reviewed cosign binary, not whatever an installer action fetches.
      - name: Install cosign
        run: |
          scripts/install-cosign.sh "${RUNNER_TEMP}/cosign-bin"
          echo "${RUNNER_TEMP}/cosign-bin" >> "${GITHUB_PATH}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ matrix.image }}
          flavor: |
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=match,pattern=v(.*),group=1
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'release' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      # Pushed by digest only: no tag points here until the next step has
      # signed and verified it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA v1 is what the signing step attests and the admission
          # examples require. The SBOM generator image is pinned too.
          provenance: mode=max,version=v1
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          # Private GenDec release assets for Pulse binary stage.
          secrets: |
            github_token=${{ secrets.GENDEC_READ_TOKEN || secrets.GITHUB_TOKEN }}
          # Release images intentionally override the Dockerfile default so the
          # component matrix for this Shapoclyack release is explicit here.
          build-args: |
            INSTALL_NMAP=${{ matrix.install_nmap }}
            PULSE_VERSION=v1.1.0
          cache-from: type=gha,scope=${{ matrix.name }}
          # mode=max + multi-platform (linux/amd64,linux/arm64) on the larger
          # images (esp. aio) regularly hangs/fails "preparing build cache for
          # export" with ERROR: not_found -- a known buildx/BuildKit issue
          # (moby/buildkit#6008, #4628) triggered by mode=max cache size on
          # big images. mode=min exports far less (final layers only) and
          # avoids it; ignore-error=true means a cache-export failure (which
          # happens strictly after the image itself is already pushed, see
          # the "pushing manifest ... done" step above) no longer fails the
          # whole job -- it only costs a colder cache on the next build.
          cache-to: type=gha,mode=min,scope=${{ matrix.name }},ignore-error=true

      # Keyless: the certificate names this workflow at this ref, so the
      # identity verified here is the one a customer pins. A failure leaves
      # the digest untagged and the job red — the fallback publisher fails
      # closed exactly like the release pipeline.
      - name: Sign, attest provenance, verify, then tag
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=(--keyless
            --identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
            --issuer https://token.actions.githubusercontent.com)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--release "${GITHUB_REF_NAME}")
          fi
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              args+=(--tag "${tag}")
            fi
          done <<< "${TAGS}"
          scripts/sign-release-image.sh "${args[@]}" "${IMAGE}@${DIGEST}"
