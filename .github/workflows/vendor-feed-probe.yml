name: Vendor feed publication probe
on:
  pull_request:
    paths: ['.github/workflows/vendor-feed-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.number == 494 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read published SUSE public verification keys
        run: |
          mkdir -p /tmp/vendor-probe
          python3 - <<'PY'
          import json, pathlib, urllib.request
          from html.parser import HTMLParser
          root=pathlib.Path('/tmp/vendor-probe'); base='https://ftp.suse.com/pub/projects/security/keys/'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.links.extend(v for k,v in attrs if k=='href')
          data=urllib.request.urlopen(base,timeout=30).read(1048576)
          (root/'keys-index.html').write_bytes(data); parser=Links(); parser.feed(data.decode())
          for n,ref in enumerate(parser.links):
              if '/' in ref or ref.startswith('?') or not ref.endswith(('.asc','.key','.gpg','.pub','.txt')): continue
              content=urllib.request.urlopen(base+ref,timeout=15).read(1048576)
              (root/ref).write_bytes(content)
          print(parser.links)
          PY
          for key in /tmp/vendor-probe/*; do gpg --batch --show-keys --with-colons "$key" || true; done
      - name: Export public AL2023 key from official image and metadata
        run: |
          docker run --rm --entrypoint cat public.ecr.aws/amazonlinux/amazonlinux:2023 /etc/pki/rpm-gpg/RPM-GPG-KEY-amazon-linux-2023 > /tmp/vendor-probe/amazon-linux-2023.asc
          gpg --batch --show-keys --with-colons /tmp/vendor-probe/amazon-linux-2023.asc
          python3 - <<'PY'
          import pathlib,urllib.request,xml.etree.ElementTree as ET
          root=pathlib.Path('/tmp/vendor-probe'); mirrors='https://cdn.amazonlinux.com/al2023/core/mirrors/latest/x86_64/mirror.list'
          base=urllib.request.urlopen(mirrors,timeout=30).read().decode().strip().splitlines()[0].rstrip('/')+'/'
          for name in ['repomd.xml','repomd.xml.asc']:
              (root/name).write_bytes(urllib.request.urlopen(base+'repodata/'+name,timeout=30).read(1048576))
          tree=ET.fromstring((root/'repomd.xml').read_bytes()); ns={'r':'http://linux.duke.edu/metadata/repo'}
          elem=tree.find("r:data[@type='updateinfo']/r:location",ns); url=base+elem.attrib['href']
          assert url.startswith('https://cdn.amazonlinux.com/')
          (root/'updateinfo-source-url.txt').write_text(url)
          (root/'updateinfo.xml.gz').write_bytes(urllib.request.urlopen(url,timeout=60).read(67108865))
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: vendor-verification-keys
          path: /tmp/vendor-probe
          retention-days: 7
