name: Vendor feed publication probe
on:
  pull_request:
    paths: ['.github/workflows/vendor-feed-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.number == 494 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public trust publication
        run: |
          mkdir -p /tmp/vendor-probe
          python3 - <<'PY'
          import json, pathlib, urllib.request
          from html.parser import HTMLParser
          root = pathlib.Path('/tmp/vendor-probe')
          urls = {
            'suse-directory': 'https://ftp.suse.com/pub/projects/security/',
            'suse-csaf-directory': 'https://ftp.suse.com/pub/projects/security/csaf/',
            'suse-metadata': 'https://ftp.suse.com/pub/projects/security/provider-metadata.json',
            'amazon-key': 'https://cdn.amazonlinux.com/_assets/11a7a6e5c44ad63371a0b6d5a0090b97/RPM-GPG-KEY-amazon-linux-2023',
            'amazon-key2': 'https://cdn.amazonlinux.com/amazon-linux-2023/RPM-GPG-KEY-amazon-linux-2023',
          }
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a': self.links.extend(v for k,v in attrs if k == 'href')
          result = {}
          for name,url in urls.items():
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      body = response.read(16*1024*1024)
                      (root/name).write_bytes(body)
                      result[name]={'status': response.status, 'size':len(body), 'sample':body[:5000].decode('utf-8',errors='replace')}
                      if 'directory' in name:
                          parser=Links(); parser.feed(body.decode()); result[name]['links']=[x for x in parser.links if not x.endswith('.json')][:200]
              except Exception as exc: result[name]={'error':str(exc)}
          (root/'report.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result,indent=2))
          PY
      - name: Inspect signed Red Hat archive layout
        run: |
          base=https://security.access.redhat.com/data/csaf/v2/advisories
          name=$(curl --fail --silent --show-error --max-time 30 "$base/archive_latest.txt")
          [[ "$name" =~ ^csaf_advisories_[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar\.zst$ ]]
          curl --fail --silent --show-error --max-time 100 "$base/$name" -o /tmp/vendor-probe/archive.tar.zst
          curl --fail --silent --show-error --max-time 30 "$base/$name.asc" -o /tmp/vendor-probe/archive.asc
          tar --zstd -tf /tmp/vendor-probe/archive.tar.zst > /tmp/vendor-probe/archive-members.txt
          head -30 /tmp/vendor-probe/archive-members.txt
          rm /tmp/vendor-probe/archive.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: vendor-trust-publication
          path: /tmp/vendor-probe
          retention-days: 7
