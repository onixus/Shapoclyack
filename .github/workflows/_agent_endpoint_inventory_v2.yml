name: Apply endpoint inventory v2

on:
  push:
    branches:
      - feat/endpoint-inventory-v2-instances

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shapoclyack
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo-ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octo -d shapoclyack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/endpoint-inventory-v2-instances
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply schema v2 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          schemas = Path("api/schemas.py")
          text = schemas.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    install_location: str | None = Field(default=None, max_length=1024)\n",
              "    install_location: str | None = Field(default=None, max_length=1024)\n"
              "    # Opaque SHA-256 over agent-local installation evidence. The raw\n"
              "    # profile SID or path need not become a durable server identifier.\n"
              "    install_instance_id: str | None = Field(\n"
              "        default=None, min_length=64, max_length=64, pattern=r\"^[0-9a-f]{64}$\"\n"
              "    )\n",
              "software input instance field",
          )
          text = replace_once(
              text,
              '    """Body for ``POST /api/endpoint/inventory`` (schema v1)."""',
              '    """Body for ``POST /api/endpoint/inventory`` (schema v1 or v2)."""',
              "snapshot schema doc",
          )
          text = replace_once(
              text,
              "    schema_version: Literal[1]\n",
              "    schema_version: Literal[1, 2]\n",
              "snapshot schema versions",
          )
          info_start = text.index("class EndpointSoftwareItemInfo(BaseModel):")
          info_end = text.find("\n\nclass ", info_start + 1)
          if info_end == -1:
              raise RuntimeError("could not locate EndpointSoftwareItemInfo block")
          info_block = text[info_start:info_end]
          info_block = replace_once(
              info_block,
              "    install_location: str | None = None\n",
              "    install_location: str | None = None\n"
              "    install_instance_id: str | None = None\n",
              "software output instance field",
          )
          text = text[:info_start] + info_block + text[info_end:]
          schemas.write_text(text, encoding="utf-8")

          models = Path("api/db/models.py")
          text = models.read_text(encoding="utf-8")
          model_start = text.index("class EndpointSoftwareItem(Base):")
          model_end = text.find("\n\nclass ", model_start + 1)
          if model_end == -1:
              raise RuntimeError("could not locate EndpointSoftwareItem model block")
          block = text[model_start:model_end]
          block = block.replace(
              "stable sha256(name|publisher|architecture|source) used for diffing",
              "stable schema-aware digest used for diffing",
              1,
          )
          block = replace_once(
              block,
              "    install_location: Mapped[str | None] = mapped_column(default=None)\n",
              "    install_location: Mapped[str | None] = mapped_column(default=None)\n"
              "    install_instance_id: Mapped[str | None] = mapped_column(default=None)\n",
              "software model instance field",
          )
          text = text[:model_start] + block + text[model_end:]
          models.write_text(text, encoding="utf-8")

          service = Path("api/services/endpoint_inventory.py")
          text = service.read_text(encoding="utf-8")
          key_start = text.index("def _comparison_key(")
          key_end = text.index("\ndef _canonical_digest", key_start)
          key_fn = '''def _comparison_key(item: Any, schema_version: int) -> str:
              components = [
                  (item.name or "").strip().lower(),
                  (item.publisher or "").strip().lower(),
                  (item.architecture or "").strip().lower(),
                  item.source,
              ]
              if schema_version >= 2:
                  components.append((item.install_instance_id or "").strip().lower())
              raw = "|".join(components)
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()

          '''
          text = text[:key_start] + key_fn + text[key_end + 1:]
          marker = "    keys_seen: set[str] = set()\n"
          validation = '''    if request.schema_version == 1 and any(
                  item.install_instance_id is not None for item in request.software
              ):
                  raise ValueError(
                      "install_instance_id requires endpoint inventory schema version 2"
                  )

          '''
          text = replace_once(text, marker, validation + marker, "v1 instance guard")
          text = text.replace(
              "_comparison_key(item)",
              "_comparison_key(item, request.schema_version)",
          )
          if text.count("_comparison_key(item, request.schema_version)") < 3:
              raise RuntimeError("not every inventory comparison key call was upgraded")
          text = replace_once(
              text,
              "                    install_location=item.install_location,\n",
              "                    install_location=item.install_location,\n"
              "                    install_instance_id=item.install_instance_id,\n",
              "persist installation instance",
          )
          output_marker = '                        "install_location": row.install_location,\n'
          text = replace_once(
              text,
              output_marker,
              output_marker + '                        "install_instance_id": row.install_instance_id,\n',
              "return installation instance",
          )
          duplicate_old = (
              '                f"architecture={item.architecture!r}, source={item.source!r})"\n'
          )
          duplicate_new = (
              '                f"architecture={item.architecture!r}, source={item.source!r}, "\n'
              '                f"install_instance_id={item.install_instance_id!r})"\n'
          )
          text = replace_once(text, duplicate_old, duplicate_new, "duplicate error detail")
          service.write_text(text, encoding="utf-8")

          api_ts = Path("web-next/src/lib/api.ts")
          text = api_ts.read_text(encoding="utf-8")
          type_start = text.index("export type EndpointSoftwareItemInfo = {")
          type_end = text.index("};", type_start)
          block = text[type_start:type_end]
          block = replace_once(
              block,
              "  install_location: string | null;\n",
              "  install_location: string | null;\n"
              "  install_instance_id?: string | null;\n",
              "web software instance field",
          )
          text = text[:type_start] + block + text[type_end:]
          api_ts.write_text(text, encoding="utf-8")

          tests = Path("tests/test_endpoint_inventory_service.py")
          text = tests.read_text(encoding="utf-8")
          additions = r'''

          INSTANCE_A = "a" * 64
          INSTANCE_B = "b" * 64
          INSTANCE_C = "c" * 64


          def _jdk(version: str, instance_id: str) -> EndpointSoftwareItem:
              return EndpointSoftwareItem(
                  name="OpenJDK",
                  version=version,
                  publisher="Eclipse Adoptium",
                  architecture="x86_64",
                  source="java",
                  install_location=f"/usr/lib/jvm/temurin-{version}",
                  install_instance_id=instance_id,
              )


          def test_schema_v2_preserves_side_by_side_installations(settings):
              result = endpoint_inventory.ingest_snapshot(
                  tenant_id="default",
                  agent_id="agent-1",
                  request=_request(
                      schema_version=2,
                      software=[_jdk("17.0.12", INSTANCE_A), _jdk("21.0.4", INSTANCE_B)],
                  ),
              )

              assert result["software_count"] == 2
              software = endpoint_inventory.list_software_for_asset(
                  "default", result["asset_id"]
              )
              assert {item["version"] for item in software} == {"17.0.12", "21.0.4"}
              assert {item["install_instance_id"] for item in software} == {
                  INSTANCE_A,
                  INSTANCE_B,
              }


          def test_schema_v2_diffs_installations_independently(settings):
              endpoint_inventory.ingest_snapshot(
                  tenant_id="default",
                  agent_id="agent-1",
                  request=_request(
                      schema_version=2,
                      snapshot_id="snap_1",
                      software=[_jdk("17.0.12", INSTANCE_A), _jdk("21.0.4", INSTANCE_B)],
                  ),
              )
              result = endpoint_inventory.ingest_snapshot(
                  tenant_id="default",
                  agent_id="agent-1",
                  request=_request(
                      schema_version=2,
                      snapshot_id="snap_2",
                      software=[_jdk("17.0.13", INSTANCE_A), _jdk("22.0.1", INSTANCE_C)],
                  ),
              )

              assert result["changes"] == {"installed": 1, "removed": 1, "updated": 1}


          def test_schema_v1_rejects_install_instance_identity(settings):
              with pytest.raises(ValueError, match="schema version 2"):
                  endpoint_inventory.ingest_snapshot(
                      tenant_id="default",
                      agent_id="agent-1",
                      request=_request(software=[_jdk("17.0.12", INSTANCE_A)]),
                  )


          def test_schema_v2_rejects_duplicate_install_instance(settings):
              with pytest.raises(ValueError, match="duplicate software entry"):
                  endpoint_inventory.ingest_snapshot(
                      tenant_id="default",
                      agent_id="agent-1",
                      request=_request(
                          schema_version=2,
                          software=[_jdk("17.0.12", INSTANCE_A), _jdk("17.0.13", INSTANCE_A)],
                      ),
                  )


          def test_install_instance_id_must_be_lowercase_sha256():
              with pytest.raises(Exception):
                  EndpointSoftwareItem(
                      name="OpenJDK",
                      version="17",
                      source="java",
                      install_instance_id="not-a-sha256",
                  )
          '''
          text += additions
          tests.write_text(text, encoding="utf-8")

          api_tests = Path("tests/test_api_endpoint_inventory.py")
          text = api_tests.read_text(encoding="utf-8")
          text += r'''


          def test_submit_schema_v2_side_by_side_installations(tmp_path, monkeypatch):
              client = _client(tmp_path, monkeypatch)
              body = _load_fixture("endpoint_inventory_v2_instances_valid.json")
              response = client.post(
                  "/api/endpoint/inventory", headers=_agent_headers(), json=body
              )

              assert response.status_code == 201, response.text
              assert response.json()["software_count"] == 2
          '''
          api_tests.write_text(text, encoding="utf-8")
          PY
      - name: Compile and lint changed Python
        run: |
          python -m compileall api tests
          ruff check \
            api/schemas.py \
            api/db/models.py \
            api/services/endpoint_inventory.py \
            api/db/migrations/versions/0063_endpoint_software_instances.py \
            tests/test_endpoint_inventory_service.py \
            tests/test_api_endpoint_inventory.py
      - name: Apply migrations
        env:
          OCTO_POSTGRES_URL: postgresql+psycopg://octo:octo-ci-secret@127.0.0.1:5432/shapoclyack
        run: alembic -c api/db/alembic.ini upgrade head
      - name: Run endpoint inventory tests
        env:
          OCTO_POSTGRES_URL: postgresql+psycopg://octo:octo-ci-secret@127.0.0.1:5432/shapoclyack
        run: pytest -q tests/test_endpoint_inventory_service.py tests/test_api_endpoint_inventory.py
      - name: Validate TypeScript contract
        working-directory: web-next
        run: |
          npm ci
          npm run typecheck
      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_agent_endpoint_inventory_v2.yml
          git add \
            api/schemas.py \
            api/db/models.py \
            api/services/endpoint_inventory.py \
            api/db/migrations/versions/0063_endpoint_software_instances.py \
            tests/fixtures/endpoint_inventory_v2_instances_valid.json \
            tests/test_endpoint_inventory_service.py \
            tests/test_api_endpoint_inventory.py \
            web-next/src/lib/api.ts
          git commit -m "feat(endpoint): accept distinct software installation instances"
          git push origin HEAD:feat/endpoint-inventory-v2-instances
