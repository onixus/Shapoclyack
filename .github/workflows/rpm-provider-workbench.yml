name: RPM provider validation

# Temporary PR-local validation; the resulting verified tree deletes this file.
on:
  pull_request:
    paths: ['.github/workflows/rpm-provider-workbench.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.number == 494 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: shapoclyack
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo-ci-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U octo -d shapoclyack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and verify reviewed source tree
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'onixus/Shapoclyack'
          base = 'https://api.github.com/repos/' + repository
          def api(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args])
          chunks = ['18a2b8f46bf38922f33688c7b0128ed990226723', 'd28111264b0f166e6d6250927b64a4702b7f68fb', '7746d53a3b79174a9c1fbb5df47795be00e8373d', '4ed4712a5863290f0be94b2b208044e2d4aef0c4', 'd70fbb1c904f48a51dd710c13e3fbbf7c1e4bc24', '96421ed69b870d9da91a920f41340b088a13e998', '13b81878192c50b9c8c9be10c0e390378eb134b5', '5fe713ce310558bc1a0932a2c1bb45fb888d6017', 'ca59797981798155cd77a481f8a212b9bf853c69', '484449f689395b3932c7e49dca0ade1069686cd8', '3332d9adbd10fde129b057f6efc165f66dd5f584', '61bd569348a6a6d0325df9daba2d3ba797013a29', '092fa3d3182e5c841925663ec66bdbf3d383a1a6', 'b43648097a68481e5662b6a3f0031c084b7ce63f', 'f518a64e13d85fa318ae35402682b34b4e7e2f53', 'f4ddad98a1e961c877f744b50190f7cef5468c39', '458c119d76567c58b40359119a221a7e284a0ec1', '39e446c25ec896216ce3ded50c0c1f37f7d53860', 'abf96fd27ad216bd2c85f188f7fdc10fed6bce76', 'be3ed5dba58b1c2d06a64a5cbd83f50ad160eaba', 'fdec8f65af5ed3450d46cd23277eae981689ec25']
          data = b''.join(base64.b64decode(api('/git/blobs/' + sha)['content']) for sha in chunks)
          assert hashlib.sha256(data).hexdigest() == 'ef09118d01bc7cdeffcfc9b637f44f1deefce26d27a2bfb829e23749eef3dfe8'
          result_dir = Path('/tmp/rpm-results')
          result_dir.mkdir()
          patch = result_dir / 'reviewed.patch'
          patch.write_bytes(gzip.decompress(data))
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/rpm-provider-workbench.yml'], check=True)
          expected = '16b2fd47fc25d8aab28269a88d80c823c27d1462'
          assert git('write-tree').decode().strip() == expected
          parent = git('rev-parse', 'HEAD').decode().strip()
          parent_tree = api('/git/commits/' + parent)['tree']['sha']
          entries = []
          for raw_path in git('diff', '--cached', '--name-only', '-z').split(b'\0'):
              if not raw_path:
                  continue
              path = raw_path.decode()
              indexed = git('ls-files', '-s', '--', path)
              if not indexed:
                  entries.append(dict(path=path, mode='100644', type='blob', sha=None))
                  continue
              mode, sha, stage_path = indexed.decode().split(None, 2)
              content = git('cat-file', 'blob', sha)
              written = api('/git/blobs', dict(content=base64.b64encode(content).decode(), encoding='base64'))
              assert written['sha'] == sha, path
              entries.append(dict(path=path, mode=mode, type='blob', sha=sha))
          # Store immutable Git objects only. A reviewed connector action creates
          # the commit/ref later; this job never updates a branch or pull request.
          tree = api('/git/trees', dict(base_tree=parent_tree, tree=entries))
          assert tree['sha'] == expected
          (result_dir / 'tree.json').write_text(json.dumps(dict(parent=parent, tree=expected, files=entries), indent=2))
          print('Verified tree:', expected)
          PYCODE
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Ruff and compile
        run: |
          ./scripts/ci-lint.sh
          python -m compileall -q api scanner tests agent
          git diff --cached --check
      - name: PostgreSQL migrations
        env:
          OCTO_POSTGRES_URL: postgresql+psycopg://octo:octo-ci-secret@127.0.0.1:5432/shapoclyack
        run: alembic -c api/db/alembic.ini upgrade head
      - name: Focused PostgreSQL API and provider regressions
        env:
          OCTO_POSTGRES_URL: postgresql+psycopg://octo:octo-ci-secret@127.0.0.1:5432/shapoclyack
          OCTO_REQUIRE_INTEGRATION: '0'
        run: |
          set -o pipefail
          python -m pytest -q tests/test_rpm_advisories.py tests/test_rpm_advisory_lifecycle.py tests/test_api_rpm_advisories.py tests/test_api_software_cve_match.py tests/test_software_cve_match.py tests/test_software_finding*.py tests/test_software_match_worker.py tests/test_advisory*.py tests/test_package_identity.py tests/test_version_compare.py tests/test_windows_cve_match.py tests/test_retro_match.py tests/test_retro_findings.py tests/test_enrichment_bundle.py tests/test_air_gap_feeds.py tests/test_api_system.py --junitxml=/tmp/rpm-results/python.xml 2>&1 | tee /tmp/rpm-results/python.log
      - uses: actions/setup-node@v4
        if: always() && steps.materialize.outcome == 'success'
        with:
          node-version: '26'
      - name: Full frontend lint typecheck tests and build
        if: always() && steps.materialize.outcome == 'success'
        run: |
          set -o pipefail
          ./scripts/ci-web.sh 2>&1 | tee /tmp/rpm-results/frontend.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rpm-provider-validation
          path: /tmp/rpm-results
          retention-days: 7
          if-no-files-found: error
