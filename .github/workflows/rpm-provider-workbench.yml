name: RPM provider workbench

# Temporary PR-local offline review material, removed before merge.
on:
  pull_request:
    paths: ['.github/workflows/rpm-provider-workbench.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.event.pull_request.number == 494 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export tracked sources only
        run: |
          mkdir -p /tmp/rpm-workbench
          git archive HEAD | gzip > /tmp/rpm-workbench/source.tar.gz
      - name: Download hash-locked wheels for isolated offline tests
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d /tmp/rpm-workbench/wheels
      - name: Fetch public vendor samples for format inspection
        run: |
          mkdir -p /tmp/rpm-workbench/vendor
          curl -fLSs --max-time 30 https://security.access.redhat.com/data/csaf/v2/advisories/2025/rhsa-2025_23127.json -o /tmp/rpm-workbench/vendor/rhel.json || true
          curl -fLSs --max-time 30 https://ftp.suse.com/pub/projects/security/csaf/suse-su-2024_3307-1.json -o /tmp/rpm-workbench/vendor/suse.json || true
          curl -fLSs --max-time 30 https://raw.githubusercontent.com/RedHatProductSecurity/security-data-guidelines/main/csaf-vex/csaf-vex.json -o /tmp/rpm-workbench/vendor/redhat-example.json || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rpm-provider-workbench
          path: /tmp/rpm-workbench
          retention-days: 1
          if-no-files-found: error
