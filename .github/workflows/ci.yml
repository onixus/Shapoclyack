name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: Ruff check
        run: ruff check scanner api tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      # Native service: Postgres needs no CMD args, just env — health-checked
      # by the runner itself, no manual polling loop required.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: octo_man
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo-ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octo -d octo_man"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall scanner api tests agent
      - name: Start JetStream broker
        # NATS needs --jetstream/--store_dir/--http_port as CMD args, which
        # GitHub Actions' native `services:` cannot override (services only
        # take image/env/ports/options — no way to change the container's
        # command) — so this stays a manual docker run.
        run: |
          docker run -d --name ci-nats-js -p 4222:4222 -p 8222:8222 \
            nats:2.10.24-alpine --jetstream --store_dir=/data --http_port=8222
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8222/healthz >/dev/null && break
            sleep 0.5
          done
      - name: Apply Alembic migrations
        env:
          OCTO_POSTGRES_URL: postgresql+psycopg://octo:octo-ci-secret@127.0.0.1:5432/octo_man
        run: alembic -c api/db/alembic.ini upgrade head
      - name: Run tests
        env:
          OCTO_NATS_URL: nats://127.0.0.1:4222
          OCTO_POSTGRES_URL: postgresql+psycopg://octo:octo-ci-secret@127.0.0.1:5432/octo_man
        run: |
          python -m pytest -q \
            --cov=api --cov=scanner --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=74
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  web:
    name: Web dashboard (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install, lint, test, and build
        working-directory: web-next
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  kustomize:
    name: Kustomize (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate overlays
        run: ./k8s/scripts/validate-kustomize.sh

  image:
    # Builds the actual default distributed image (INSTALL_NMAP=0, no nmap /
    # nmap-vulners / vulscan) -- see issue #97 Phase 1. This is what
    # ghcr.io/onixus/shapoclyack-{scanner,aio} ship as `latest`, so this is
    # the path e2e/load/scan/SBOM need to exercise, not the opt-in -nmap one.
    name: Image (build, smoke, e2e, scan, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: network-scan-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Private GenDec releases: set repo secret GENDEC_READ_TOKEN
          # (classic PAT with contents:read on onixus/GenDec). Optional once
          # GenDec releases/packages are public.
          secrets: |
            github_token=${{ secrets.GENDEC_READ_TOKEN || secrets.GITHUB_TOKEN }}
          # No PULSE_VERSION override -- follow the Dockerfile's own ARG
          # default (see docker-publish.yml for why this must not be pinned
          # here). INSTALL_NMAP=0 matches the published default image.
          build-args: |
            INSTALL_NMAP=0
      - name: Smoke-check toolchain in image
        # naabu/pulse carry cap_net_raw+cap_net_admin as file capabilities
        # (see Dockerfile); --cap-add must match compose / e2e / k8s manifests.
        # No nmap here: this is the default Nmap-free image (see nmap-legacy
        # job below for the opt-in INSTALL_NMAP=1 path).
        run: |
          docker run --rm --cap-add NET_RAW --cap-add NET_ADMIN --entrypoint sh network-scan-cli:ci -c '
            set -e
            naabu -version
            dnsx -version
            pulse --version
            ! command -v nmap
            python -m compileall scanner
          '
      - name: End-to-end scan against a target container
        run: bash tests/e2e/run.sh network-scan-cli:ci
      - name: Light synthetic load test (16 targets)
        uses: ./.github/actions/synthetic-load-test
        with:
          image: network-scan-cli:ci
          build: "false"
          hosts: "16"
          config: tests/load/config.yaml
          resume_test: "false"
          scan_timeout_sec: "2400"
          metrics_path: load-metrics-ci-${{ github.run_id }}.json
          artifact_name: load-test-metrics-ci-${{ github.run_id }}
      - name: Trivy report (non-blocking, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: network-scan-cli:ci
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: network-scan-cli:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: network-scan-cli:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  image-nmap-legacy:
    # Opt-in INSTALL_NMAP=1 path (published as the `-nmap` tag, see
    # docker-publish.yml and issue #97). Lighter than the `image` job above
    # -- just confirms the legacy toolchain still builds and NSE data lands
    # where nse.py expects it; e2e/load/scan/SBOM run against the default
    # image instead, since that's what's actually distributed as `latest`.
    name: Image nmap-legacy (build, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (INSTALL_NMAP=1)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: network-scan-cli:ci-nmap
          cache-from: type=gha,scope=nmap-legacy
          cache-to: type=gha,mode=max,scope=nmap-legacy
          secrets: |
            github_token=${{ secrets.GENDEC_READ_TOKEN || secrets.GITHUB_TOKEN }}
          build-args: |
            INSTALL_NMAP=1
      - name: Smoke-check nmap toolchain in image
        run: |
          docker run --rm --cap-add NET_RAW --cap-add NET_ADMIN --entrypoint sh network-scan-cli:ci-nmap -c '
            set -e
            naabu -version
            dnsx -version
            pulse --version
            nmap --version | head -n 1
            test -f /usr/share/nmap/scripts/nmap-vulners/vulners.nse
            test -f /usr/share/nmap/scripts/vulscan/vulscan.nse
            python -m compileall scanner
          '
