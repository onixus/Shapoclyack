name: PR Gate

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      # Keep the lint scope and Ruff pin shared with Jenkins/full CI. A second
      # hand-written invocation is how the pipelines drifted in the first place.
      - name: Ruff check
        run: ./scripts/ci-lint.sh

      - name: Compile Python sources
        run: python -m compileall scanner api tests agent

      # This is deliberately the infrastructure-free PR gate. PostgreSQL/NATS
      # suites skip when their URLs are absent; the manual full CI and Jenkins
      # run scripts/ci-pytest.sh with OCTO_REQUIRE_INTEGRATION=1 to prove those
      # suites actually executed.
      - name: Unit tests without infrastructure
        env:
          OCTO_REQUIRE_INTEGRATION: "0"
        run: python -m pytest -q --maxfail=1
