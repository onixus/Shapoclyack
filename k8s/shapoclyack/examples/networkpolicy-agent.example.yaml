# Restrict remote scanner agents: DNS + API (+ optional NATS) only.
# Apply with agent Deployment (examples/agent-deployment.example.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shapoclyack-agent-egress
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: agent
  policyTypes:
    - Egress
  egress:
    # Cluster DNS: the API's Service name and every scan target. The scanner
    # hands dnsx the pod's /etc/resolv.conf nameserver as -r, so this rule
    # covers dnsx too. A sensor with dns.resolvers set in its scanner config
    # asks those addresses instead and needs UDP/TCP 53 to them added here.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Shapoclyack API (ClusterIP)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
    # NATS JetStream (optional Phase 1 job pull)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
---
# API pod: allow ingress from agents + Ingress controller; egress for vulners/DD optional.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shapoclyack-api-ingress
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: agent
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
