# Example local Maddy SMTP for Phase 5.3 alerts (dev / lab only).
# Pair with alerts.smtp.enabled + OCTO_SMTP_* (see scanner/config/default.yaml).
#
#   kubectl apply -n network-scan -f k8s/shapoclyack/examples/maddy-deployment.example.yaml
#
# Scanner / aio can then use:
#   OCTO_SMTP_HOST=shapoclyack-maddy
#   OCTO_SMTP_PORT=25
#   OCTO_SMTP_FROM=alerts@example.test
#   OCTO_SMTP_TO=ops@example.test
#
# Configure real DKIM/PTR in Maddy before setting require_dkim / require_ptr in production.
# Default image entrypoint expects /data/maddy.conf — mount your own ConfigMap/PVC for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-maddy
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: maddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: maddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: maddy
    spec:
      containers:
        - name: maddy
          image: foxcpp/maddy:0.9.5@sha256:de42151adff6388edb5e4ee88f60334fa1ab85e309485193ecb1c2db20203315
          ports:
            - name: smtp
              containerPort: 25
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shapoclyack-maddy
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: maddy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: maddy
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
