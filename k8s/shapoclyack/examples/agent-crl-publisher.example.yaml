# Optional platform CRL publisher (#515). Before applying:
# - deploy an API image containing migration 0083 and api.agent_crl (main;
#   the pinned 0.46 image below is a baseline, not CRL-capable: replace it);
# - create shapoclyack-sensor-client-crl with ca.crt copied from the dedicated
#   self-signed issuing CA, and an initial ca.crl from python -m api.agent_crl;
# - point ingress auth-tls-secret at network-scan/shapoclyack-sensor-client-crl;
# - create shapoclyack-sensor-crl-signer with tls.crt/tls.key for THAT CA.
# This CRL Secret is separate from cert-manager's CA Secret, so reconciliation
# cannot erase ca.crl. No CA private key is sent to ingress or to a sensor.
# For an intermediate issuer, include the parent CA's CRL using --append-crl;
# see docs/operations.md. Do not assume this one-CA example covers a PKI chain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-crl-publisher
  namespace: network-scan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-crl-publisher
  namespace: network-scan
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["shapoclyack-sensor-client-crl"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-crl-publisher
  namespace: network-scan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-crl-publisher
subjects:
  - kind: ServiceAccount
    name: agent-crl-publisher
    namespace: network-scan
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-crl-publisher
  namespace: network-scan
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shapoclyack
            app.kubernetes.io/component: crl-publisher
        spec:
          serviceAccountName: agent-crl-publisher
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              # Replace with the verified digest of a CRL-capable release.
              image: ghcr.io/onixus/shapoclyack-api:shapoclyack-0.46-0922@sha256:05f8a602511b5b0c6e04b29c503e5b77a793f4ea7abfc742044b08fd55357f2d
              command: ["python", "-m", "api.agent_crl"]
              args: ["--secret", "network-scan/shapoclyack-sensor-client-crl"]
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-postgres
                      key: password
                - name: OCTO_POSTGRES_URL
                  value: postgresql+psycopg://octo:$(POSTGRES_PASSWORD)@shapoclyack-postgres-client:5432/shapoclyack
                - name: OCTO_AGENT_MTLS_ISSUER_CERT
                  value: /signer/tls.crt
                - name: OCTO_AGENT_MTLS_ISSUER_KEY
                  value: /signer/tls.key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: signer
                  mountPath: /signer
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: signer
              secret:
                secretName: shapoclyack-sensor-crl-signer
                defaultMode: 0440
            - name: tmp
              emptyDir: {}
---
# Admit this optional client without giving it API/scanner pod labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shapoclyack-postgres-crl-publisher
  namespace: network-scan
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: crl-publisher
      ports:
        - protocol: TCP
          port: 5432
