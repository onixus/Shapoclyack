# Where scan artifacts go when OCTO_ARTIFACT_BACKEND=s3 (#336).
#
# Consumed by overlays/prod-ha/artifacts-s3-patch.yaml. The key names match
# `shapoclyack-backup` (k8s/shapoclyack/base/backup/postgres-cronjob.yaml) so
# an installation that already stores its database dumps in object storage
# describes this the same way.
#
#   kubectl -n network-scan create secret generic shapoclyack-artifacts \
#     --from-literal=bucket=shapoclyack-artifacts \
#     --from-literal=prefix=prod \
#     --from-literal=region=eu-central-1 \
#     --from-literal=access_key_id=... \
#     --from-literal=secret_access_key=...
#
# Omit access_key_id/secret_access_key on a cluster where the pods carry an
# instance role or IRSA — boto3 finds those itself, and a Secret that does not
# exist cannot leak. `prefix`, `region` and `endpoint_url` are optional.
#
# The bucket holds findings: private, encrypted at rest, versioning on so a
# mistaken delete is recoverable. Do NOT add a lifecycle rule that expires
# objects — run retention (OCTO_RUN_RETENTION_DAYS) already prunes them through
# the API, and a second policy in the bucket would delete runs the console
# still lists.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-artifacts
  namespace: network-scan
type: Opaque
stringData:
  bucket: "REPLACE-WITH-YOUR-BUCKET"
  prefix: "prod"
  region: "REPLACE-WITH-YOUR-REGION"
  # endpoint_url: "http://minio.minio.svc.cluster.local:9000"
  access_key_id: "REPLACE-ME"
  secret_access_key: "REPLACE-ME"
