# API auth secrets. Both Secrets below are REQUIRED for a default (prod)
# deployment: since #155 the API refuses to start when the JWT secret is still
# the built-in default, when OCTO_API_USERS is unset (which would activate the
# demo accounts published in this repository), or when CORS allows any origin.
# The refusal names every unset variable at once. Only the dev overlay, which
# sets OCTO_ENV=dev, may come up without them.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-api
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # openssl rand -hex 32
  # Every API replica must share this value: tokens are signed with it, so a
  # per-replica secret makes each replica reject the others' sessions.
  jwt_secret: replace-with-long-random-string
---
# Console users and the CORS allow-list. Mounted with `envFrom`, so every key
# here becomes an environment variable — the Secret is named "-api-users" for
# historical reasons but carries the API's non-default configuration generally.
#
# Still declared `optional: true` on the Deployment: the dev overlay runs
# without it on purpose, and a missing Secret there should not wedge the pod in
# CreateContainerConfigError. In prod the startup check is what refuses, with a
# message that names the missing variable — a clearer failure than a kubelet
# mount error.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-api-users
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # ONE-TIME BOOTSTRAP since #156. Console accounts live in the Postgres
  # `users` table; this list is imported on a first start with an empty table
  # and ignored from then on — later edits here do nothing. Manage accounts
  # through /api/users, and rotate passwords through /api/auth/password.
  #
  # A plaintext password is hashed on the way in and never stored as typed.
  # Supply a bcrypt hash ("$2...") instead if you would rather it never appear
  # in a manifest at all. Remove this key once the import is confirmed.
  OCTO_API_USERS: |
    [
      {"username":"admin","password":"replace-me","role":"admin"},
      {"username":"operator","password":"replace-me","role":"operator"},
      {"username":"viewer","password":"replace-me","role":"viewer"}
    ]
  # Exact origins the console is served from, comma-separated. "*" is refused
  # in prod: with credentials in play a wildcard lets any page a logged-in
  # operator visits call this API with their session.
  OCTO_API_CORS: https://shapoclyack.example.com
---
# Optional Slack / Telegram credentials for CronJob / Job --notify.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-alerts
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: alerts
type: Opaque
stringData:
  OCTO_SLACK_WEBHOOK: ""
  OCTO_TELEGRAM_BOT_TOKEN: ""
  OCTO_TELEGRAM_CHAT_ID: ""
  # Optional SMTP via local Maddy / relay (Phase 5.3)
  OCTO_SMTP_HOST: "127.0.0.1"
  OCTO_SMTP_PORT: "25"
  OCTO_SMTP_FROM: ""
  OCTO_SMTP_TO: ""
  # Optional Cloudflare DNS import (Phase 5.1)
  OCTO_CLOUDFLARE_API_TOKEN: ""
---
# DefectDojo export credentials (optional; pair with --export-defectdojo / defectdojo.enabled).
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-defectdojo
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: defectdojo
type: Opaque
stringData:
  OCTO_DEFECTDOJO_URL: "https://defectdojo.example.com"
  OCTO_DEFECTDOJO_API_KEY: ""
---
# Shared token for remote scanner agents (legacy). Prefer provisioning keys (Phase 2).
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-agent
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: agent
type: Opaque
stringData:
  # Legacy shared bearer (maps to tenant_id=default). Optional when using provisioning keys.
  OCTO_AGENT_TOKEN: replace-with-long-random-string
  # Phase 2: per-tenant provisioning key (agent exchanges for short-lived JWT).
  OCTO_AGENT_PROVISIONING_KEY: ""
