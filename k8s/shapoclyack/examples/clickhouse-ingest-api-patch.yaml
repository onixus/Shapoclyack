# Enable NATS + ClickHouse ingest worker on the API Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Repeated from base/api-deployment.yaml on purpose: a strategic
            # merge puts this patch's env entries ahead of the base list, and
            # $(NATS_PASSWORD) only expands against a variable defined earlier.
            # Declaring it here keeps that true wherever the patch is applied.
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: api_password
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-clickhouse
                  key: password
            - name: OCTO_NATS_URL
              value: nats://api:$(NATS_PASSWORD)@shapoclyack-nats-client:4222
            - name: OCTO_CLICKHOUSE_URL
              value: http://default:$(CLICKHOUSE_PASSWORD)@shapoclyack-clickhouse-client:8123
            - name: OCTO_CH_INGEST_ENABLED
              value: "true"
