# Bucket credentials for the daily backup CronJobs in base/backup/.
#
# Base does not generate these. Without them both Jobs fail at their deadline
# and the backup alerts fire (docs/disaster-recovery.md). Replace every
# REPLACE-ME before applying; these files are examples, not a kustomize
# resource, so `kubectl apply -k` never creates them.
#
#   kubectl apply -f k8s/shapoclyack/examples/backup-s3.secret.example.yaml
#
# Two Secrets, two key pairs, on purpose. The ClickHouse job's BACKUP needs
# s3:DeleteObject for its `.lock` object. On the Postgres job's key that right
# would reach every dump. Scope them apart:
#
#   shapoclyack-backup
#     PREFIX/*                         PutObject, GetObject, AbortMultipartUpload, ListBucket
#     not PREFIX/clickhouse/*          so a dump key cannot delete a ClickHouse backup either
#   shapoclyack-clickhouse-backup-s3
#     PREFIX/clickhouse/*              PutObject, GetObject, DeleteObject, AbortMultipartUpload
#     bucket                           ListBucket, with an s3:prefix condition
#
# The ClickHouse job appends `clickhouse/<stamp>/` itself
# (base/backup/clickhouse-backup.sh), so both Secrets share `prefix`. Leave
# `endpoint_url` commented out for AWS; set it for MinIO or another
# S3-compatible store. Omit the key pair only if the pod has an instance role
# or IRSA — then drop the access_key_id and secret_access_key keys, do not
# leave REPLACE-ME.
#
# The ClickHouse *server* uploads the backup, not this job's pod, so the
# server also needs egress to the endpoint and a trust store that accepts its
# certificate. A read-only copy of each key, kept outside the cluster, is what
# a restore uses.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-backup
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  access_key_id: "REPLACE-ME"
  secret_access_key: "REPLACE-ME"
  region: "REPLACE-WITH-YOUR-REGION"
  bucket: "REPLACE-WITH-YOUR-BUCKET"
  prefix: "prod"
  # endpoint_url: "http://minio.minio.svc.cluster.local:9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-clickhouse-backup-s3
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: clickhouse-backup
type: Opaque
stringData:
  access_key_id: "REPLACE-ME-CLICKHOUSE-KEY"
  secret_access_key: "REPLACE-ME-CLICKHOUSE-SECRET"
  region: "REPLACE-WITH-YOUR-REGION"
  bucket: "REPLACE-WITH-YOUR-BUCKET"
  prefix: "prod"
  # endpoint_url: "http://minio.minio.svc.cluster.local:9000"
