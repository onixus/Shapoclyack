# The external Postgres URL that overlays/prod-ha expects (#335).
#
# NOT part of the overlay on purpose: it holds a password, and a placeholder
# here would be a database that half-works. The overlay references this Secret
# by name, so applying the overlay without creating it first leaves the API
# pods in CreateContainerConfigError naming `shapoclyack-postgres-external` —
# which is the failure we want, rather than a silent fallback to a database
# that is not there.
#
# Create it out of band, not from this file:
#
#   kubectl -n network-scan create secret generic shapoclyack-postgres-external \
#     --from-literal=url='postgresql+psycopg://octo:PASSWORD@db.example.internal:5432/shapoclyack?sslmode=verify-full&sslrootcert=/etc/ssl/postgres-ca/ca.crt'
#
# or through ExternalSecrets (see externalsecret.example.yaml), which is what
# an installation with a secret store should do — the literal above lands in
# shell history.
#
# `sslmode=verify-full` is not decoration: without any `sslmode=` libpq
# negotiates TLS opportunistically and accepts whatever certificate it is
# handed, and OCTO_ENV=prod logs a warning about exactly that (api/settings.py).
# `verify-full` also checks the hostname, so the name in the URL has to be the
# one in the certificate's SAN. `sslrootcert=` points at a CA bundle mounted
# into the API pod — see docs/operations.md § Transport encryption; managed
# providers publish theirs, and AWS RDS / Cloud SQL certificates chain to a
# bundle you download rather than mint.
#
# The role needs CREATE on the database: the API's migrate init container runs
# Alembic on every rollout.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-postgres-external
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  url: postgresql+psycopg://octo:REPLACE-ME@db.example.internal:5432/shapoclyack?sslmode=verify-full&sslrootcert=/etc/ssl/postgres-ca/ca.crt
