# Pair with agent-deployment.example.yaml when using NATS job dispatch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-agent
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: agent_password
            - name: OCTO_NATS_URL
              value: nats://agent:$(NATS_PASSWORD)@shapoclyack-nats-client:4222
