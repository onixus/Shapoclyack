# Optional ExternalSecrets Operator template (Phase 2.4).
# Requires ESO installed in the cluster. Maps vault/SM keys → Kubernetes Secrets
# consumed by the API / agent / backup workloads (no plaintext keys in manifests).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shapoclyack-api
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shapoclyack-store
    kind: ClusterSecretStore
  target:
    name: shapoclyack-api
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: shapoclyack/api
        property: jwt_secret
---
# The API's non-default configuration, mounted with envFrom — including the KEK
# that the integration secrets in Postgres are wrapped with (#310).
#
# Refreshing OCTO_MASTER_KEY here does NOT rotate anything: the API read it
# once at boot, and the stored rows name the key that opens them. A rotation is
# "add the new key, keep the old one in OCTO_MASTER_KEY_PREVIOUS, roll out, run
# the online pass, then drop the old key" — see docs/operations.md § Secrets at
# rest. Putting the KEK in the same store as the database credentials buys
# nothing, so keep them in separate paths if the store supports it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shapoclyack-api-users
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shapoclyack-store
    kind: ClusterSecretStore
  target:
    name: shapoclyack-api-users
    creationPolicy: Owner
  data:
    - secretKey: OCTO_MASTER_KEY
      remoteRef:
        key: shapoclyack/api
        property: master_key
    # creationPolicy: Owner replaces the whole Secret, so everything else
    # api-secrets.example.yaml puts in shapoclyack-api-users has to be listed
    # here too — otherwise ESO takes the API's CORS allow-list, its public URL
    # and the console bootstrap away on its first refresh and the pod refuses
    # to start ("no console account exists").
    - secretKey: OCTO_API_CORS
      remoteRef:
        key: shapoclyack/api
        property: cors_origins
    - secretKey: OCTO_PUBLIC_BASE_URL
      remoteRef:
        key: shapoclyack/api
        property: public_base_url
    # One-time console bootstrap (#156): read once into an empty `users` table
    # and ignored from then on. Drop this entry — and the property behind it —
    # once the import is confirmed; while it is listed here it has to keep
    # resolving, like every other entry.
    - secretKey: OCTO_API_USERS
      remoteRef:
        key: shapoclyack/api
        property: api_users
    # ONLY during a KEK rotation. Every `data` entry is mandatory: a remoteRef
    # the store cannot resolve fails the whole ExternalSecret, and with
    # creationPolicy: Owner that means the Secret stops being refreshed — so an
    # entry for a property that exists only inside a rotation window would take
    # the API's own configuration down with it. Uncomment this entry at step 1
    # of docs/operations.md § Rotating the KEK, once the property exists in the
    # store, and comment it out again at step 4.
    # - secretKey: OCTO_MASTER_KEY_PREVIOUS
    #   remoteRef:
    #     key: shapoclyack/api
    #     property: master_key_previous
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shapoclyack-agent
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shapoclyack-store
    kind: ClusterSecretStore
  target:
    name: shapoclyack-agent
    creationPolicy: Owner
  data:
    # Prefer per-tenant provisioning key (exchanged for agent JWT at runtime).
    - secretKey: OCTO_AGENT_PROVISIONING_KEY
      remoteRef:
        key: shapoclyack/agent
        property: provisioning_key
    # Optional legacy shared token for lab migrations.
    - secretKey: OCTO_AGENT_TOKEN
      remoteRef:
        key: shapoclyack/agent
        property: legacy_token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shapoclyack-clickhouse
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shapoclyack-store
    kind: ClusterSecretStore
  target:
    name: shapoclyack-clickhouse
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: shapoclyack/clickhouse
        property: password
---
# A refreshed value here does NOT restart anything: ESO rewrites the Secret,
# but nats-server read $NATS_*_PASSWORD once at boot and the API read its URL
# once at boot. Treat a rotation as the rollout described in
# docs/operations.md § Data-plane credentials, not as something that happens on
# refreshInterval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shapoclyack-nats
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: nats
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shapoclyack-store
    kind: ClusterSecretStore
  target:
    name: shapoclyack-nats
    creationPolicy: Owner
  data:
    - secretKey: api_password
      remoteRef:
        key: shapoclyack/nats
        property: api_password
    - secretKey: agent_password
      remoteRef:
        key: shapoclyack/nats
        property: agent_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shapoclyack-backup
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shapoclyack-store
    kind: ClusterSecretStore
  target:
    name: shapoclyack-backup
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef:
        key: shapoclyack/backup
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: shapoclyack/backup
        property: secret_access_key
    - secretKey: region
      remoteRef:
        key: shapoclyack/backup
        property: region
    - secretKey: bucket
      remoteRef:
        key: shapoclyack/backup
        property: bucket
    - secretKey: prefix
      remoteRef:
        key: shapoclyack/backup
        property: prefix
    # Leave this property as an empty string for AWS S3; set it for MinIO or
    # another S3-compatible endpoint.
    - secretKey: endpoint_url
      remoteRef:
        key: shapoclyack/backup
        property: endpoint_url
