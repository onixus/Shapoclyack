# Agent execution mode with the LEGACY shared agent token.
#
# Agent mode itself is base's default since #338 and needs nothing from this
# file: sensors, the in-cluster scanner-executor included, authenticate with
# per-tenant provisioning keys. What is left here is OCTO_AGENT_TOKEN, which is
# deprecated and refused in prod from 2027-03-01 (docs/configuration.md) — use
# it only while migrating a fleet that still holds it.
#
# Required:
#   OCTO_JOB_EXECUTION_MODE=agent
#   OCTO_ALLOW_SCAN_START=true
#   OCTO_AGENT_TOKEN=<from secret shapoclyack-agent>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: OCTO_JOB_EXECUTION_MODE
              value: agent
            - name: OCTO_ALLOW_SCAN_START
              value: "true"
            - name: OCTO_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-agent
                  key: OCTO_AGENT_TOKEN
