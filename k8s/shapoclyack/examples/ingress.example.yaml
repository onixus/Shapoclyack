# Optional Ingress for the dashboard/API. Adjust className and host for your cluster.
#
# TLS is not optional (#309): the console posts credentials and the API carries
# operator JWTs, agent provisioning keys and whole vulnerability reports. The
# annotations below assume ingress-nginx + cert-manager; on another controller
# keep `spec.tls` and use that controller's equivalent of the redirect.
#
#   kubectl apply -f ingress.example.yaml
#
# Without cert-manager, drop the cluster-issuer annotation and create the
# `shapoclyack-api-tls` Secret yourself (kubectl create secret tls).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shapoclyack-api
  namespace: network-scan
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # A plaintext request has already put the password or the bearer token on
    # the wire, so the redirect is damage control, not protection — it is here
    # so a bookmarked http:// link does not silently keep working.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    #
    # The `/` rule below publishes the whole API, the unauthenticated
    # operational endpoints included: `/metrics` names every route, the queue
    # depth and login outcomes, and `/livez` / `/readyz` are for the kubelet,
    # not the internet (#319). An Ingress cannot exclude a path, so refuse them
    # at the edge — uncomment this (ingress-nginx must be running with
    # `allow-snippet-annotations: "true"`), or set `OCTO_METRICS_TOKEN` on the
    # API, or publish the console through a vhost that is not this Service.
    # nginx.ingress.kubernetes.io/server-snippet: |
    #   location ~ ^/(metrics|livez|readyz)$ { return 404; }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shapoclyack.example.com
      secretName: shapoclyack-api-tls
  rules:
    - host: shapoclyack.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shapoclyack-api
                port:
                  number: 8080
