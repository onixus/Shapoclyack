# The loader's own identity: it needs the registry pull secret and nothing
# else. No RoleBinding refers to it, and no token is mounted — the loader reads
# one volume and writes another, and never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enrichment-bundle
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: enrichment-bundle
automountServiceAccountToken: false
imagePullSecrets:
  - name: shapoclyack-registry
