apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shapoclyack-postgres
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: postgres
spec:
  serviceName: shapoclyack-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shapoclyack
            - name: POSTGRES_USER
              value: octo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "octo", "-d", "shapoclyack"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "octo", "-d", "shapoclyack"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Read-only image (#338). Postgres itself writes PGDATA (the PVC) and
          # its socket + lock file in /var/run/postgresql. The entrypoint adds
          # /tmp: uid 999 has no passwd entry in the alpine image, so on first
          # init it fakes one with nss_wrapper in two mktemp files.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: shapoclyack
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
