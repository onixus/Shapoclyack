# Registry credentials ride on the ServiceAccounts, not on each workload (#339):
# every pod that runs as one of these gets the pull secret without its manifest
# naming it, so a private or air-gapped registry is one Secret and one name.
#
# `shapoclyack-registry` is a placeholder. Nothing in this repository creates
# it, and on a cluster that pulls from public registries it need not exist — the
# kubelet logs a FailedToRetrieveImagePullSecret event and pulls anonymously.
# Create it for a private registry:
#
#   kubectl -n network-scan create secret docker-registry shapoclyack-registry \
#     --docker-server=registry.internal.example --docker-username=<user> \
#     --docker-password=<token>
#
# or rename it in an overlay (patch target `kind: ServiceAccount`,
# `/imagePullSecrets/0/name`) — overlays/enrichment-airgap does both halves and
# docs/air-gap.md walks through them. Pods on the namespace's `default`
# ServiceAccount (the datastores, the backup and enrichment CronJobs) are
# covered there too: that account belongs to the namespace, not to these
# manifests, so it is patched rather than declared.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: scanner
imagePullSecrets:
  - name: shapoclyack-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
imagePullSecrets:
  - name: shapoclyack-registry
