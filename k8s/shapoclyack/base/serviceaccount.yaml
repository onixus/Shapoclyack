# Neither account is given a token (#338): nothing in this namespace talks to
# the Kubernetes API — scheduler leadership is a Postgres advisory lock
# (api/services/leader_lock.py), not a Lease — and a mounted token is a
# credential an RCE gets for free. The pod templates say the same thing
# themselves, so a pod moved to another account does not quietly regain one.
apiVersion: v1
kind: ServiceAccount
# Registry credentials ride on the ServiceAccounts, not on each workload (#339):
# every pod that runs as one of these gets the pull secret without its manifest
# naming it. `shapoclyack-registry` is a placeholder nothing here creates; a
# cluster pulling from public registries does not need it (the kubelet records
# FailedToRetrieveImagePullSecret and pulls anonymously). For a private or
# air-gapped registry create it —
#   kubectl -n network-scan create secret docker-registry shapoclyack-registry \
#     --docker-server=registry.internal.example --docker-username=<user> \
#     --docker-password=<token>
# — or rename it in an overlay. overlays/airgap also puts it on the pods that
# run as the namespace's `default` account (datastores, backup, the online
# enrichment refresh); docs/air-gap.md walks through both.
imagePullSecrets:
  - name: shapoclyack-registry
metadata:
  name: scanner
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: scanner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
imagePullSecrets:
  - name: shapoclyack-registry
metadata:
  name: api
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
automountServiceAccountToken: false
