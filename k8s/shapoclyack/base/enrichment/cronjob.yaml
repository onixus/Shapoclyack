apiVersion: batch/v1
kind: CronJob
metadata:
  name: enrichment-refresh
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: enrichment-cronjob
spec:
  # Daily 03:00 UTC — ahead of the weekly Sunday 02:00 scan (cronjob.yaml) so a
  # fresh scan always has same-day-or-newer EPSS/KEV/GeoIP/CVSS4 data.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shapoclyack
            app.kubernetes.io/component: enrichment-cronjob
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: fetch-enrichment
              image: ghcr.io/onixus/shapoclyack-aio:shapoclyack-0.44-0907@sha256:d5dee841f44057c56a68750fffed49f970af85fe0e5419af160b6d0ccd9873ba
              imagePullPolicy: IfNotPresent
              command: ["scripts/fetch-enrichment.sh"]
              env:
                - name: OCTO_ENRICHMENT_DIR
                  value: /app/scanner/data
                # Optional — falls back to keyless DB-IP City Lite when unset.
                - name: MAXMIND_LICENSE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-geoip
                      key: maxmind_license_key
                      optional: true
                # Optional — scripts/fetch-cvss4-db.py works without it, but
                # NVD throttles anonymous callers to 5 req/30s (50 with a key),
                # which turns a full CVSS4 refresh into an activeDeadline
                # timeout. The key stored via the config API never reaches this
                # pod: it is only exported by scanner/main.py inside a scan
                # process, so the Secret below is the only way to key the fetch.
                - name: NVD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-nvd
                      key: nvd_api_key
                      optional: true
                # Opt-in vendor advisory refresh (Debian tracker / Ubuntu USN)
                # for software->CVE matching. Off unless the ConfigMap exists
                # and says otherwise, because the Debian tracker JSON is ~50 MB
                # and an installation has to ask for that request before this
                # job makes it daily. Without this entry the flag could only be
                # set by editing the manifest, so the datasets would stay at
                # the committed seed forever — which the System page would
                # report honestly, and nobody could act on.
                - name: OCTO_ADVISORY_FETCH_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: shapoclyack-enrichment
                      key: advisory_fetch_enabled
                      optional: true
              resources:
                requests:
                  cpu: "250m"
                  memory: 512Mi
                limits:
                  cpu: "1"
                  # Sized for GeoIP/CVSS4/EPSS/KEV, which is what this job does
                  # unless a cluster opts into the advisory feeds above. That
                  # opt-in needs 2Gi -- the Debian tracker document is read,
                  # parsed and re-serialized whole and a ~50 MB JSON of nested
                  # per-release objects is several hundred MB once it is Python
                  # -- and it raises the ceiling itself, through
                  # examples/enrichment-advisories-patch.yaml applied beside the
                  # ConfigMap. Kept out of the base because a namespace under a
                  # LimitRange of max.memory: 1Gi would have this pod rejected
                  # at admission and lose the daily refresh of every feed, for a
                  # dataset it never asked for.
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: enrichment-data
                  mountPath: /app/scanner/data
          volumes:
            - name: enrichment-data
              persistentVolumeClaim:
                claimName: enrichment-data
