# Optional enrichment component (not part of default base).
# Enable via: kubectl apply -k k8s/shapoclyack/overlays/enrichment
#         or: kubectl apply -k k8s/shapoclyack/overlays/kind-enrichment
#
# A Component rather than a plain resource dir so it can be layered onto more
# than one overlay: patch paths inside a component resolve relative to this
# directory, whereas an overlay may only reference patch files at or below
# itself. That is what lets overlays/kind-enrichment reuse this patch instead
# of copying it.
#
# Sets its own namespace transformer since this component's PVC/CronJob must
# land in the same namespace as the API pods that mount enrichment-data by
# claimName — the overlays that include it have no namespace transformer, so
# without this the resources here would default to "default" and the claimName
# reference would never resolve. An unsetOnly one, not `namespace:` (#338):
# see namespace-transformer.yaml.
#
# The scans themselves do not read this volume any more (#338). They run in the
# scanner-executor, in another namespace, and a pod cannot mount a PVC from
# outside its own; scanner-side GeoIP/CVSS4 come from the data baked into the
# image at build time. The API — EPSS/KEV/CVSS4 scoring, the System page — reads
# the refreshed copies here as before. docs/k8s-hardening.md § What changes.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

transformers:
  - namespace-transformer.yaml

resources:
  - pvc.yaml
  - cronjob.yaml

patches:
  - path: api-enrichment-patch.yaml
