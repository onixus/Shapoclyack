# Companion to delete-executor-configmap.yaml. Base generates the shared
# capture token in both namespaces; with the executor gone, only the
# network-scan copy remains. Leaving both makes any overlay that sets
# ``namespace:`` (or kind-restore's collapse) hit a Secret ID conflict.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-screenshot-worker
  namespace: network-scan-executor
$patch: delete
