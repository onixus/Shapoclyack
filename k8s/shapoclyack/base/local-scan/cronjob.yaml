apiVersion: batch/v1
kind: CronJob
metadata:
  name: network-scan-scheduled
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: scan-cronjob
spec:
  # Sundays 02:00 UTC — change to match your cadence (replaces compose scheduler).
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shapoclyack
            app.kubernetes.io/component: scan-cronjob
        spec:
          restartPolicy: Never
          serviceAccountName: scanner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scanner
              image: ghcr.io/onixus/shapoclyack-aio:shapoclyack-0.46-0922@sha256:40a7312b39b46d2fce7e529a2ce7003834b32f880f8579ffff5850c5e2b0b161
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "scanner.main"]
              args:
                - --config
                - /app/scanner/config/k8s.yaml
                - --mode
                - balanced
                - --delta
              envFrom:
                - secretRef:
                    name: shapoclyack-alerts
                    optional: true
              resources:
                requests:
                  cpu: "4"
                  memory: 4Gi
                limits:
                  cpu: "8"
                  memory: 8Gi
              # Same deviations from `restricted` as the scanner-executor, for the
              # same reasons (base/scanner-executor/statefulset.yaml,
              # docs/k8s-hardening.md); everything else is the baseline (#338).
              securityContext:
                allowPrivilegeEscalation: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - NET_RAW
                    - NET_ADMIN
              volumeMounts:
                - name: data
                  mountPath: /app/scanner/output
                  subPath: output
                - name: data
                  mountPath: /app/scanner/state
                  subPath: state
                - name: inputs
                  mountPath: /app/scanner/inputs
                  readOnly: true
                - name: config
                  mountPath: /app/scanner/config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/octo
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: scanner-data
            - name: inputs
              secret:
                secretName: scan-targets
            - name: config
              configMap:
                name: scanner-config
            - name: tmp
              emptyDir:
                sizeLimit: 5Gi
            - name: home
              emptyDir:
                sizeLimit: 1Gi
