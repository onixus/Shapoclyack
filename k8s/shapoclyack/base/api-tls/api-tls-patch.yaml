# Serve the API over TLS (moved here from overlays/kind-dev, #338 review).
#
# The API terminates it itself (`OCTO_API_TLS_CERT`/`_KEY`, api/__main__.py)
# rather than behind an ingress: the scanner-executor dials the Service, not
# the ingress, and on kind there is no ingress controller at all.
#
# The port does not change. On the kind stand that keeps the cluster's single
# extraPortMapping (changing k8s/kind-config.yaml means recreating the
# cluster, which discards the Postgres volume); everywhere else it keeps every
# client's port.
#
# The probes move to HTTPS with it. They would otherwise speak plaintext to a
# TLS listener and fail, and kubelet does not verify the certificate for an
# `httpGet` probe, so a self-signed one is not a problem here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-api
spec:
  template:
    spec:
      volumes:
        - name: api-tls
          secret:
            secretName: shapoclyack-api-tls
            defaultMode: 0400
      containers:
        - name: api
          env:
            - name: OCTO_API_TLS_CERT
              value: /etc/shapoclyack/tls/tls.crt
            - name: OCTO_API_TLS_KEY
              value: /etc/shapoclyack/tls/tls.key
          volumeMounts:
            - name: api-tls
              mountPath: /etc/shapoclyack/tls
              readOnly: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              scheme: HTTPS
