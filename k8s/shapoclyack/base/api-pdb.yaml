apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shapoclyack-api
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
spec:
  # maxUnavailable, not minAvailable: base and overlays/prod run ONE API pod,
  # and `minAvailable: 1` on a single replica means "no voluntary disruption is
  # ever allowed" — `kubectl drain` on that node blocks forever, so a node
  # upgrade needs the PDB deleted by hand (#335). `maxUnavailable: 1` lets the
  # eviction through, which is the honest statement for a single-replica
  # install: there is nothing here to keep available, the rollout strategy
  # (maxUnavailable: 0 / maxSurge: 1) is what limits the gap.
  #
  # overlays/prod-ha inherits this unchanged rather than patching it: at N >= 2
  # replicas the same rule keeps N-1 available and serialises drains, which is
  # strictly stronger than `minAvailable: 1` — that would let five of six
  # replicas be evicted at once during a parallel node upgrade.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: api
