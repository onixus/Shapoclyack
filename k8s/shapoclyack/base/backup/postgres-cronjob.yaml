apiVersion: batch/v1
kind: CronJob
metadata:
  name: shapoclyack-postgres-backup
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: backup
spec:
  # Daily at 02:15 UTC. Production overlays may patch this to a tighter RPO.
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shapoclyack
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  umask 027
                  archive=/backup/shapoclyack.dump
                  checksum=/backup/shapoclyack.dump.sha256

                  pg_dump \
                    --host="${PGHOST}" \
                    --port="${PGPORT}" \
                    --username="${PGUSER}" \
                    --dbname="${PGDATABASE}" \
                    --format=custom \
                    --compress=6 \
                    --no-owner \
                    --no-privileges \
                    --file="${archive}"

                  sha256sum "${archive}" > "${checksum}"
                  test -s "${archive}"
                  test -s "${checksum}"
              env:
                - name: PGHOST
                  value: shapoclyack-postgres-client
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: octo
                - name: PGDATABASE
                  value: shapoclyack
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-postgres
                      key: password
              resources:
                requests:
                  cpu: "100m"
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup-tmp
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.40
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  prefix="${S3_PREFIX#/}"
                  prefix="${prefix%/}"
                  if [ -n "${prefix}" ]; then
                    target="s3://${S3_BUCKET}/${prefix}/${stamp}"
                  else
                    target="s3://${S3_BUCKET}/${stamp}"
                  fi

                  aws_s3_cp() {
                    src="$1"
                    dst="$2"
                    if [ -n "${S3_ENDPOINT_URL:-}" ]; then
                      aws --endpoint-url "${S3_ENDPOINT_URL}" s3 cp "${src}" "${dst}" --only-show-errors
                    else
                      aws s3 cp "${src}" "${dst}" --only-show-errors
                    fi
                  }

                  aws_s3_cp /backup/shapoclyack.dump "${target}/shapoclyack.dump"
                  aws_s3_cp /backup/shapoclyack.dump.sha256 "${target}/shapoclyack.dump.sha256"
                  printf 'backup_success timestamp=%s object_prefix=%s\n' "${stamp}" "${target}"
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-backup
                      key: access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-backup
                      key: secret_access_key
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-backup
                      key: region
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-backup
                      key: bucket
                - name: S3_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-backup
                      key: prefix
                - name: S3_ENDPOINT_URL
                  valueFrom:
                    secretKeyRef:
                      name: shapoclyack-backup
                      key: endpoint_url
                      optional: true
              resources:
                requests:
                  cpu: "50m"
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup-tmp
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: backup-tmp
              emptyDir:
                sizeLimit: 10Gi
