apiVersion: batch/v1
kind: CronJob
metadata:
  name: shapoclyack-postgres-backup
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: backup
spec:
  # Daily at 02:15 UTC. Production overlays may patch this to a tighter RPO.
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failed