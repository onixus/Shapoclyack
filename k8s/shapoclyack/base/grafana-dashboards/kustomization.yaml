# Optional Grafana dashboards (#334), as ConfigMaps for the Grafana sidecar.
#
#   components:
#     - ../../base/grafana-dashboards
#
# (overlays/prod-ha-monitoring is prod-ha with this and base/monitoring.)
#
# The dashboards sidecar of the Grafana Helm chart
# (`sidecar.dashboards.enabled: true`) loads every ConfigMap carrying the label
# below from the namespaces it watches. kube-prometheus-stack's defaults match
# as they are (label `grafana_dashboard`, labelValue "1", searchNamespace ALL);
# the standalone grafana chart watches only its own namespace unless
# `sidecar.dashboards.searchNamespace` names this one or is ALL.
# `grafana_folder` is read only where the chart sets
# `sidecar.dashboards.folderAnnotation: grafana_folder` together with
# `provider.foldersFromFilesStructure: true`; elsewhere the dashboards land in
# the sidecar's default folder.
#
# Needs no CRD, so unlike base/monitoring it cannot make an apply fail. It is
# opt-in all the same: an installation without Grafana has no use for ~120 kB
# of ConfigMaps.
#
# The JSON files are the source of truth, and are importable as they are
# (Dashboards → New → Import) on a Grafana outside the cluster: both choose
# their Prometheus data source through a variable. docs/observability.md
# describes the panels; tests/test_observability_assets.py fails when a query
# names a series the API does not export.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

namespace: network-scan

configMapGenerator:
  # One ConfigMap per dashboard, and names without a content hash: the sidecar
  # selects by label, and a hashed name would leave the previous revision's
  # ConfigMap behind on every edit — two files with one dashboard uid, which
  # Grafana's provisioning refuses to load.
  - name: shapoclyack-dashboard-platform
    files:
      - shapoclyack-platform.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: dashboards
      annotations:
        grafana_folder: Shapoclyack
  - name: shapoclyack-dashboard-product
    files:
      - shapoclyack-product.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: dashboards
      annotations:
        grafana_folder: Shapoclyack
