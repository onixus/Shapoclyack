# Prometheus Operator PrometheusRule for Shapoclyack (#186, #334), as part of
# the opt-in `base/monitoring` component. GENERATED from
# examples/prometheus-slo.rules.yaml by k8s/scripts/render-prometheusrule-slo.py
# — edit that file and re-run the script, never this one.
#
# No namespace here: the component's transformer sets it, so an overlay that
# moves the installation moves the rules with it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shapoclyack-slo
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: slo
spec:
  groups:
  - name: shapoclyack.slo.availability
    rules:
    - alert: ShapoclyackApiAvailabilityFastBurn
      expr: "(\n  sum(rate(octo_http_requests_total{status=~\"5..\"}[1h]))\n  /\n  sum(rate(octo_http_requests_total[1h]))\n\
        ) > (14.4 * 0.005)\n"
      for: 2m
      labels:
        severity: page
        slo: '1'
      annotations:
        summary: Shapoclyack API availability is burning the monthly error budget fast
        description: "5xx share over 1h exceeds 14.4\xD7 the 0.5 % budget (SLO 1, 99.5 %). See docs/slo.md\
          \ and k8s/shapoclyack/examples/prometheus-slo.rules.yaml."
    - alert: ShapoclyackApiAvailabilitySlowBurn
      expr: "(\n  sum(rate(octo_http_requests_total{status=~\"5..\"}[6h]))\n  /\n  sum(rate(octo_http_requests_total[6h]))\n\
        ) > (6 * 0.005)\n"
      for: 15m
      labels:
        severity: ticket
        slo: '1'
      annotations:
        summary: Shapoclyack API availability is burning the monthly error budget slowly
        description: "5xx share over 6h exceeds 6\xD7 the 0.5 % budget (SLO 1)."
  - name: shapoclyack.slo.latency
    rules:
    - alert: ShapoclyackApiReadLatencyP95
      expr: "histogram_quantile(0.95, sum by (le) (\n  rate(octo_http_request_duration_seconds_bucket{method=\"\
        GET\"}[5m])\n)) > 0.5\n"
      for: 15m
      labels:
        severity: ticket
        slo: '2'
      annotations:
        summary: Shapoclyack GET p95 is above the 500 ms SLO
        description: p95 of GET requests over 5m exceeds 500 ms (SLO 2). POSTs that start scans or upload
          archives are excluded.
  - name: shapoclyack.slo.jobs
    rules:
    - alert: ShapoclyackJobCompletionBudget
      expr: "(\n  sum(rate(octo_job_duration_seconds_count{status=\"failed\"}[6h]))\n  /\n  sum(rate(octo_job_duration_seconds_count[6h]))\n\
        ) > 0.05\nand\nsum(rate(octo_job_duration_seconds_count[6h])) > 0\n"
      for: 30m
      labels:
        severity: ticket
        slo: '3'
      annotations:
        summary: Shapoclyack job success ratio is below 95 %
        description: Share of terminal jobs that failed over 6h exceeds 5 % (SLO 3). Cancelled jobs are
          not in this histogram.
    - alert: ShapoclyackJobDurationExceedsHistogram
      expr: "histogram_quantile(0.95, sum by (le) (\n  rate(octo_job_duration_seconds_bucket{status=\"\
        succeeded\"}[1d])\n)) > 28800\n"
      for: 1h
      labels:
        severity: ticket
        slo: '4'
      annotations:
        summary: Shapoclyack successful-job p95 exceeds the 8 h histogram
        description: SLO 4 has no repository-wide target; this fires when p95 saturates the last finite
          bucket (8 h). Set an installation-specific target from docs/slo.md after a measured month.
  - name: shapoclyack.slo.ingest
    rules:
    - alert: ShapoclyackClickHouseIngestLag
      expr: octo_nats_consumer_pending{consumer="octo-ch-ingest-results"} > 1000
      for: 10m
      labels:
        severity: ticket
        slo: '5'
      annotations:
        summary: ClickHouse ingest consumer lag is above 1000 messages
        description: "octo_nats_consumer_pending{consumer=\"octo-ch-ingest-results\"} > 1000 for 10m (SLO\
          \ 5). Absent series means ingest is not enabled \u2014 this rule does not fire then."
    - alert: ShapoclyackClickHouseIngestStale
      expr: '(time() - octo_nats_consumer_pending_timestamp_seconds{consumer="octo-ch-ingest-results"})
        > 300

        '
      for: 5m
      labels:
        severity: ticket
        slo: '5'
      annotations:
        summary: ClickHouse ingest lag gauge on {{ $labels.instance }} is stale
        description: The ingest worker has not refreshed octo_nats_consumer_pending for more than 5 minutes.
          A stopped poller leaves a stale value rather than a rising one.
    - alert: ShapoclyackNatsOutboxBacklog
      expr: max(octo_nats_outbox_backlog{kind="ingest",status="stale"}) > 0
      for: 10m
      labels:
        severity: ticket
        slo: '5'
      annotations:
        summary: Ingest publications have been unrecovered past the alert window
        description: "kind=ingest publications the broker refused have been waiting longer than OCTO_NATS_OUTBOX_BACKLOG_ALERT_SECONDS.\
          \ HTTP is healthy while the ClickHouse projection is behind. Drain per docs/operations.md \xA7\
          \ NATS outbox."
    - alert: ShapoclyackNatsOutboxAssetEventsBacklog
      expr: max(octo_nats_outbox_backlog{kind="asset_event",status="stale"}) > 0
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: Asset-event publications have been unrecovered past the alert window
        description: "kind=asset_event publications the broker refused have been waiting longer than OCTO_NATS_OUTBOX_BACKLOG_ALERT_SECONDS.\
          \ Runs can keep reaching ClickHouse, but webhook fan-out is delayed. Drain per docs/operations.md\
          \ \xA7 NATS outbox."
    - alert: ShapoclyackNatsOutboxDead
      expr: max by (kind) (octo_nats_outbox_backlog{status="dead"}) > 0
      for: 5m
      labels:
        severity: page
      annotations:
        summary: NATS outbox {{ $labels.kind }} publications have exhausted their retries
        description: "A {{ $labels.kind }} entry reached OCTO_NATS_OUTBOX_MAX_ATTEMPTS or was recorded\
          \ with no replayable body. Nothing retries it again: it needs an operator decision \u2014 nats_outbox.requeue_dead,\
          \ a re-scan, or discard_dead. kind=ingest blocks the ClickHouse projection; kind=asset_event\
          \ blocks the corresponding webhook fan-out."
    - alert: ShapoclyackNatsOutboxDropping
      expr: sum by (kind) (rate(octo_nats_outbox_total{outcome="dropped"}[15m])) > 0
      for: 5m
      labels:
        severity: ticket
      annotations:
        summary: Refused {{ $labels.kind }} publications are being dropped, not recorded
        description: OCTO_NATS_OUTBOX_ENABLED=false, so no durable row is written when the broker refuses
          this publication. For ingest the owning run publication still retries; asset events are covered
          separately by ShapoclyackAssetEventsSkipped. Turn the outbox back on.
    - alert: ShapoclyackAssetEventsSkipped
      expr: sum(rate(octo_asset_events_published_total{outcome="skipped"}[15m])) > 0
      for: 5m
      labels:
        severity: ticket
      annotations:
        summary: Asset events are being dropped, not deferred
        description: "An asset event was neither published nor recorded in nats_outbox, so the webhook\
          \ it feeds \u2014 including a new critical CVE \u2014 will not be sent at all. A run's events\
          \ are still in its diff.json, and an operator's decommission in the asset row \u2014 but nothing\
          \ resends them. outcome=\"deferred\" is the healthy version of the same outage and is covered\
          \ by the outbox alerts above."
    - alert: ShapoclyackClickHouseIngestErrors
      expr: "(\n  1 - (\n    sum(rate(octo_ch_ingest_messages_total{result=\"ok\"}[6h]))\n    /\n    sum(rate(octo_ch_ingest_messages_total[6h]))\n\
        \  )\n) > 0.001\nand\nsum(rate(octo_ch_ingest_messages_total[6h])) > 0\n"
      for: 30m
      labels:
        severity: ticket
        slo: '6'
      annotations:
        summary: ClickHouse ingest error share is above 0.1 %
        description: Ingest messages not result="ok" exceed 0.1 % over 6h (SLO 6).
  - name: shapoclyack.slo.endpoint
    rules:
    - alert: ShapoclyackEndpointInventoryAcceptance
      expr: "(\n  1 - (\n    sum(rate(octo_endpoint_inventory_submissions_total{result=\"accepted\"}[6h]))\n\
        \    /\n    sum(rate(octo_endpoint_inventory_submissions_total[6h]))\n  )\n) > 0.01\nand\nsum(rate(octo_endpoint_inventory_submissions_total[6h]))\
        \ > 0\n"
      for: 30m
      labels:
        severity: ticket
        slo: '7'
      annotations:
        summary: Endpoint inventory acceptance is below 99 %
        description: Submissions with result!="accepted" exceed 1 % over 6h (SLO 7). result="replay" counts
          against the ratio on purpose.
  - name: shapoclyack.slo.auth
    rules:
    - alert: ShapoclyackLoginLimiterTripped
      expr: sum(rate(octo_auth_attempts_total{outcome="locked"}[5m])) > 0
      for: 0s
      labels:
        severity: ticket
        slo: '8'
      annotations:
        summary: Login rate limiter is refusing attempts
        description: octo_auth_attempts_total{outcome="locked"} is rising. The limiter is already refusing
          traffic; read GET /api/auth/events.
    - alert: ShapoclyackLoginFailuresElevated
      expr: 'sum(rate(octo_auth_attempts_total{outcome="failure"}[15m]))

        >

        5 * sum(rate(octo_auth_attempts_total{outcome="failure"}[7d] offset 5m))

        '
      for: 15m
      labels:
        severity: ticket
        slo: '8'
      annotations:
        summary: Login failures are far above the weekly baseline
        description: "Failure rate over 15m is more than 5\xD7 the 7d baseline (SLO 8)."
  - name: shapoclyack.scheduler
    rules:
    - alert: ShapoclyackSchedulerSplitBrain
      expr: 'sum(octo_scheduler_is_leader) > 1

        and

        count(octo_scheduler_is_leader) > 0

        '
      for: 5m
      labels:
        severity: page
      annotations:
        summary: More than one API replica holds schedule-dispatcher leadership
        description: sum(octo_scheduler_is_leader) > 1 for 5m. Idempotency keys still prevent a duplicate
          job, but the advisory lock is not behaving as designed (ROADMAP P1.6).
    - alert: ShapoclyackSchedulerNoLeader
      expr: 'sum(octo_scheduler_is_leader) == 0

        and

        count(octo_scheduler_is_leader) > 0

        '
      for: 10m
      labels:
        severity: page
      annotations:
        summary: No API replica holds schedule-dispatcher leadership
        description: Recurring scans are not being dispatched. count()>0 so this does not fire when the
          series is simply not scraped.
  - name: shapoclyack.db
    rules:
    - alert: ShapoclyackDbPoolSaturated
      expr: "(\n  octo_db_pool_checked_out\n  /\n  (octo_db_pool_size + octo_db_pool_max_overflow)\n)\
        \ >= 0.9\n"
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: API replica {{ $labels.instance }} is holding 90 % of its database connections
        description: "octo_db_pool_checked_out has been at 90 % of OCTO_DB_POOL_SIZE + OCTO_DB_MAX_OVERFLOW\
          \ for 10m. The next burst waits for a connection and then fails after OCTO_DB_POOL_TIMEOUT.\
          \ Size the pool against the server's max_connections (docs/high-availability.md) or find what\
          \ holds connections (docs/observability.md \xA7 Database pool)."
    - alert: ShapoclyackDbPoolCheckoutTimeouts
      expr: sum by (job, instance) (increase(octo_db_pool_checkout_timeouts_total[10m])) > 0
      for: 0s
      labels:
        severity: ticket
      annotations:
        summary: Requests on {{ $labels.instance }} are failing for want of a database connection
        description: "A checkout waited OCTO_DB_POOL_TIMEOUT for a free connection and gave up, so the\
          \ request behind it answered 500 without reaching the database. A longer timeout only makes\
          \ the wait longer; see docs/observability.md \xA7 Database pool."
  - name: shapoclyack.agents
    rules:
    - alert: ShapoclyackSensorsStale
      expr: max(octo_agents{agent_kind="scanner",state="stale"}) > 0
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: '{{ $value }} active sensor(s) have not been heard from for longer than OCTO_AGENT_STALE_SECONDS'
        description: Sensors that are neither disabled nor quarantined have been stale for 15m, so the
          scans addressed to their group wait. A sensor that is gone on purpose should be disabled or
          deleted in the Sensor Fleet page rather than left to hold this alert open.
    - alert: ShapoclyackNoSensorOnline
      expr: 'max(octo_jobs_queued) > 0

        and

        sum(max by (state) (octo_agents{agent_kind="scanner",state=~"idle|busy|error"})) == 0

        and

        max(octo_agents{agent_kind="scanner",state="stale"}) > 0

        '
      for: 15m
      labels:
        severity: page
      annotations:
        summary: Scans are queued and no sensor is online to take them
        description: "Every active sensor is stale and jobs are waiting, so no scan runs at all. Local-mode\
          \ installations with no sensors registered do not fire this. docs/observability.md \xA7 Sensors\
          \ and agents."
