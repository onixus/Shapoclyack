# Opt-in for the NVD CPE-range refresh behind retro CVE matching -- see
# docs/retro-cve-matching.md.
#
# Layer it on top of base/enrichment, which already runs the refresh script:
#
#   kubectl apply -k k8s/shapoclyack/overlays/enrichment-nvd-cpe
#
# A Component for the same two reasons as base/enrichment-advisories: the flag
# and the memory it needs belong together, and a component's patch paths
# resolve relative to this directory so more than one overlay can reuse it.
#
# What this costs: the daily run asks NVD for the CVEs modified in the last
# eight days -- a handful of pages, seconds with the shapoclyack-nvd Secret and
# a minute or two without. Egress to services.nvd.nist.gov must be allowed.
#
# What it does NOT do is the first full harvest. A release image already
# carries that file: Jenkinsfile.publish runs scripts/stage-release-nvd-cpe.sh
# before docker build, and the seed floor copies it onto an empty volume.
# The daily job then merges incrementally. A branch image still has the
# committed seed; run `scripts/fetch-nvd-cpe.py --full` once with the client's
# NVD key (Secret shapoclyack-nvd) for the dataset to be coverage. Until then
# GET /api/system reports nvd_cpe as `usable: false`, which is the truth.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# unsetOnly, not `namespace:` — see namespace-transformer.yaml (#338).
transformers:
  - namespace-transformer.yaml

resources:
  - configmap.yaml

patches:
  - path: cronjob-memory-patch.yaml
