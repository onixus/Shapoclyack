apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-api
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: api
spec:
  replicas: 1
  # maxUnavailable: 0 — with replicas: 1 the default (25%, rounded down to 1)
  # takes the only API pod down *before* its replacement is ready, so every
  # rollout is a full outage rather than a rolling one. Surging by one instead
  # costs one pod's resources for the length of the rollout (#331).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: api
      annotations:
        # Annotation-based scrapers (the common `kubernetes-pods` job) pick the
        # API up with no extra objects. Inert when nothing scrapes. Operator
        # users should apply examples/servicemonitor.example.yaml instead.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: api
      # Nothing in the API calls the Kubernetes API (#338).
      automountServiceAccountToken: false
      # Longer than the default 30s and paired with the preStop sleep below: the
      # API runs in-process scan work and background workers, and SIGTERM while
      # kube-proxy still lists the pod as an endpoint drops requests that were
      # already on their way (#331).
      terminationGracePeriodSeconds: 45
      # Pod Security `restricted`, all of it (#338): the API no longer runs a
      # scanner, so it needs no capability, no privilege escalation and no
      # writable image. tests/test_k8s_pod_security.py holds every overlay's
      # API pod to this.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Runs Alembic migrations before any API replica starts — Postgres is a
      # hard dependency (tenant store lives there), and migrations aren't
      # safely idempotent across N replicas starting concurrently the way
      # ClickHouse's CREATE TABLE IF NOT EXISTS init-SQL is.
      #
      # `python -m api.db.migrate`, not bare `alembic upgrade head` (#159): it
      # takes a Postgres advisory lock first, so the replicas of a scaled
      # Deployment queue behind each other instead of migrating concurrently.
      # Waiters still run the upgrade after acquiring the lock — a no-op once
      # the first replica is done, and still correct if it failed halfway.
      # OCTO_MIGRATION_LOCK_TIMEOUT_SECONDS bounds the wait so a stuck
      # migration fails the pod with a cause instead of hanging at Init:0/1.
      initContainers:
        - name: migrate
          image: ghcr.io/onixus/shapoclyack-api:shapoclyack-0.46-0922@sha256:05f8a602511b5b0c6e04b29c503e5b77a793f4ea7abfc742044b08fd55357f2d
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "api.db.migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-postgres
                  key: password
            - name: OCTO_POSTGRES_URL
              value: postgresql+psycopg://octo:$(POSTGRES_PASSWORD)@shapoclyack-postgres-client:5432/shapoclyack
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          # The API image (Dockerfile.api): the API and the web console, and
          # none of the scanner toolchain (#338 review). This pod no longer
          # scans, so naabu, nmap and pulse with their file capabilities were
          # attack surface in the one pod holding every credential. The
          # migration above runs from the same image, so the two cannot
          # disagree on the schema; base/local-scan puts the all-in-one back.
          image: ghcr.io/onixus/shapoclyack-api:shapoclyack-0.46-0922@sha256:05f8a602511b5b0c6e04b29c503e5b77a793f4ea7abfc742044b08fd55357f2d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OCTO_OUTPUT_DIR
              value: scanner/output
            - name: OCTO_STATE_DIR
              value: scanner/state
            - name: OCTO_CONFIG
              value: scanner/config/k8s.yaml
            - name: OCTO_WEB_DIST
              value: web/dist
            - name: OCTO_ALLOW_SCAN_START
              value: "true"
            # Jobs are queued for the scanner-executor (scanner-executor/) to
            # claim, not run in this container (#338). `local` needs raw-socket
            # capabilities here and a namespace that allows them — that is
            # overlays/local-scan, see docs/k8s-hardening.md.
            - name: OCTO_JOB_EXECUTION_MODE
              value: agent
            # Declared here, ahead of the two URLs below, even though base
            # leaves both URLs empty: $(VAR) in an env value only expands
            # against variables defined EARLIER in the same container's list,
            # and the overlays that switch NATS/ClickHouse on patch the URL
            # entries in place without moving them. Defining the passwords
            # afterwards would leave a literal "$(NATS_PASSWORD)" in the URL.
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: api_password
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-clickhouse
                  key: password
            # Empty disables NATS (HTTP agent claim/upload only). Enable with:
            # nats://api:$(NATS_PASSWORD)@shapoclyack-nats-client:4222
            - name: OCTO_NATS_URL
              value: ""
            # Empty disables ClickHouse client / ingest worker. Enable with:
            # http://default:$(CLICKHOUSE_PASSWORD)@shapoclyack-clickhouse-client:8123
            - name: OCTO_CLICKHOUSE_URL
              value: ""
            - name: OCTO_CH_INGEST_ENABLED
              value: "true"
            # Required — the tenant store is Postgres-backed (Phase 7), unlike
            # the opt-in NATS/ClickHouse sidecars above.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-postgres
                  key: password
            - name: OCTO_POSTGRES_URL
              value: postgresql+psycopg://octo:$(POSTGRES_PASSWORD)@shapoclyack-postgres-client:5432/shapoclyack
            - name: OCTO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-api
                  key: jwt_secret
            # Absent except while a signing-key rotation is in flight (#314):
            # the retired key(s), comma-separated, still verified until the
            # tokens they signed expire. Optional, so base needs no such key
            # and adding one is the whole of step 2 in
            # docs/operations.md § Rotating the JWT signing key.
            - name: OCTO_JWT_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-api
                  key: jwt_secret_previous
                  optional: true
          envFrom:
            - secretRef:
                name: shapoclyack-api-users
                optional: true
          # Three probes with three different questions (#331), where all of
          # them used to be one always-200 endpoint:
          #   startup   — has the process finished booting? create_app() loads
          #               the tenant store and bootstraps accounts, so a cold
          #               start against a busy Postgres can take a while; up to
          #               5 * 30 = 150s here, and neither probe below runs until
          #               it passes.
          #   liveness  — is this process wedged? Dependency-free on purpose: a
          #               Postgres outage must not restart every replica.
          #   readiness — can this replica serve? Postgres, and NATS/ClickHouse
          #               where configured. Failing it takes the pod out of the
          #               Service instead of killing it.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and SIGTERM are dispatched concurrently, so
                # without this pause the process starts shutting down while
                # proxies still route to it. Comfortably inside the 45s grace
                # period above.
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          # This container used to hold NET_RAW+NET_ADMIN and
          # allowPrivilegeEscalation: true, for the scans it ran itself. Those
          # moved to the scanner-executor with the capabilities (#338). One
          # visible side effect: GET /api/system probes the scanner binaries
          # baked into this image, and the ones carrying file capabilities
          # (naabu, pulse, nmap) now fail execve with EPERM here — correctly,
          # since nothing here may run them; in agent mode the System page
          # lists them as not required of this container.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/scanner/output
              subPath: output
            - name: data
              mountPath: /app/scanner/state
              subPath: state
            - name: inputs
              mountPath: /app/scanner/inputs
              readOnly: true
            - name: config
              mountPath: /app/scanner/config
              readOnly: true
            # With the two PVC paths above, the whole list of places this
            # container writes (#338). /tmp takes the request bodies Starlette
            # spools to disk — a sensor's run archive among them — and the SSH
            # deployer's key and known_hosts files. $HOME is where nuclei and
            # dnsx, run for GET /api/system, write a config file they exit
            # without.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/octo
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scanner-data
        - name: inputs
          secret:
            secretName: scan-targets
            optional: true
        - name: config
          configMap:
            name: scanner-config
        # One spooled file per upload in flight, each up to
        # OCTO_AGENT_RESULTS_MAX_BODY_BYTES (128 MiB). The ingest gate turns
        # away uploads beyond its concurrent + waiting slots (12 at the
        # defaults), so 2Gi is that plus the ones still arriving; raise it
        # with either setting. Exceeding it evicts the pod.
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
