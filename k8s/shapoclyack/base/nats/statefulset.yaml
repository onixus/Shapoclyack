apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shapoclyack-nats
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: nats
spec:
  serviceName: shapoclyack-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: nats
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nats
          image: nats:2.10.24-alpine
          imagePullPolicy: IfNotPresent
          # store_dir is already set in nats.conf's jetstream block (configmap.yaml)
          # — passing --store_dir here too makes nats-server reject the config
          # as a duplicate setting.
          args:
            - "--config"
            - "/etc/nats/nats.conf"
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # nats.conf references both as $NATS_API_PASSWORD /
            # $NATS_AGENT_PASSWORD. nats-server refuses to start on an
            # undefined variable, so a missing Secret key fails the pod
            # instead of leaving the broker open.
            - name: NATS_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: api_password
            - name: NATS_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: agent_password
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
            - name: cluster
              containerPort: 6222
          # Bare /healthz is the *full* check: JetStream enabled, a meta
          # leader elected, and every stream and consumer assigned to this
          # server current. On a single node that is nearly the same thing as
          # "the server is up", which is why it was fine here — but a clustered
          # broker (overlays/prod-ha) fails it for as long as a restarted node
          # is catching its streams up, so liveness restarted the pod mid
          # catch-up and readiness took it out of the Service in the same
          # breath. The narrower forms below say what each probe actually
          # wants, and mean the same thing at replicas=1.
          readinessProbe:
            httpGet:
              # JetStream is enabled and this server is serving. Not "the
              # cluster agrees": a node still replaying its store can accept
              # clients, and pulling it from the Service does not speed it up.
              path: /healthz?js-server-only=true
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # The weakest question there is, which is the right one for
            # liveness: restarting a broker is not how a catch-up finishes.
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: shapoclyack-nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
        labels:
          app.kubernetes.io/name: shapoclyack
          app.kubernetes.io/component: nats
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
