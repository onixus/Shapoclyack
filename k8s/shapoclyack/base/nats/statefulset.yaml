apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shapoclyack-nats
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: nats
spec:
  serviceName: shapoclyack-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: nats
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nats
          image: nats:2.10.24-alpine
          imagePullPolicy: IfNotPresent
          # store_dir is already set in nats.conf's jetstream block (configmap.yaml)
          # — passing --store_dir here too makes nats-server reject the config
          # as a duplicate setting.
          args:
            - "--config"
            - "/etc/nats/nats.conf"
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # nats.conf references both as $NATS_API_PASSWORD /
            # $NATS_AGENT_PASSWORD. nats-server refuses to start on an
            # undefined variable, so a missing Secret key fails the pod
            # instead of leaving the broker open.
            - name: NATS_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: api_password
            - name: NATS_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: agent_password
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
            - name: cluster
              containerPort: 6222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: shapoclyack-nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
        labels:
          app.kubernetes.io/name: shapoclyack
          app.kubernetes.io/component: nats
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
