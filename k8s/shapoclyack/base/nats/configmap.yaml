apiVersion: v1
kind: ConfigMap
metadata:
  name: shapoclyack-nats-config
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: nats
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: /data
      max_mem: 256M
      max_file: 4G
    }

    # $SERVER_NAME (pod name, e.g. shapoclyack-nats-0) keeps cluster peers
    # distinct; set via downward API in statefulset.yaml.
    server_name: $SERVER_NAME

    # Authentication. Before this block the server took any anonymous client:
    # NATS listens on a ClusterIP Service, and remote agents reach it from
    # outside the cluster, so "anonymous" meant any pod could subscribe to
    # ingest.results.* for every tenant and publish forged jobs.scan offers.
    #
    # Two users in one account (the global $G) on purpose: JOBS/INGEST/EVENTS
    # are JetStream streams, and streams cannot be shared across accounts
    # without export/import plumbing on every subject. The split here is by
    # permission, not by account.
    #
    # $NATS_API_PASSWORD / $NATS_AGENT_PASSWORD come from the environment
    # (Secret shapoclyack-nats, wired in statefulset.yaml). nats-server refuses
    # to start on an undefined reference, so a missing key is a startup error
    # rather than a server that quietly keeps accepting everyone.
    authorization {
      users: [
        # API: publishes jobs.scan, creates the streams and consumers, and
        # consumes ingest.> for the ClickHouse worker. No permissions block —
        # it owns the whole subject tree.
        { user: api, password: $NATS_API_PASSWORD }

        # Agents pull jobs.scan and ack it; results travel back over HTTP, not
        # NATS (agent/worker.py never publishes an application subject), so the
        # allow-list below is the whole of what the worker needs. Everything
        # else — subscribing to ingest.> or events.>, publishing jobs.> — is
        # denied by omission. The JOBS/octo-agents tokens are pinned so this
        # account cannot open a pull consumer on INGEST instead.
        {
          user: agent
          password: $NATS_AGENT_PASSWORD
          permissions: {
            publish: {
              allow: [
                "$JS.API.INFO"
                "$JS.API.STREAM.NAMES"
                "$JS.API.STREAM.INFO.JOBS"
                "$JS.API.CONSUMER.INFO.JOBS.octo-agents"
                "$JS.API.CONSUMER.CREATE.JOBS.octo-agents"
                "$JS.API.CONSUMER.CREATE.JOBS.octo-agents.>"
                "$JS.API.CONSUMER.DURABLE.CREATE.JOBS.octo-agents"
                "$JS.API.CONSUMER.MSG.NEXT.JOBS.octo-agents"
                "$JS.ACK.JOBS.octo-agents.>"
              ]
            }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
      ]
    }

    # No `cluster {}` block here on purpose: base runs replicas=1, and a
    # cluster block listing unreachable peer routes (nats-1/nats-2 don't
    # exist yet) keeps the server stuck retrying routes and JetStream never
    # reports ready. Bump `spec.replicas` to 3 with examples/nats-ha-patch.yaml
    # AND examples/nats-ha-configmap-patch.yaml (which supplies the clustered
    # nats.conf) to form a real JetStream cluster; also set
    # OCTO_NATS_STREAM_REPLICAS=3 on the API so streams replicate R3.
