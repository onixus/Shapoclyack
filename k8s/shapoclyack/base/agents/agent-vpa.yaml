# Vertical Pod Autoscaler for the scanner-executor (Phase 4.2; target moved
# from the old shapoclyack-agent Deployment in #338).
# Requires the VPA admission controller / recommender in the cluster
# (e.g. gke addon, or https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: shapoclyack-scanner-executor
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: scanner-executor
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: shapoclyack-scanner-executor
  updatePolicy:
    # Initial, not Auto (#338 review): Auto resizes a running pod by evicting
    # it, and an evicted executor drops the scan it is running — the job waits
    # out its lease and starts again from nothing. Initial applies the
    # recommendation when a pod is created anyway: a rollout, a node drain, a
    # crash. A scan that outgrows its memory before then is OOMKilled and
    # requeued the same way, which Auto would not have prevented either.
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: executor
        minAllowed:
          cpu: 250m
          memory: 256Mi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
        controlledResources:
          - cpu
          - memory
        # Keep a memory limit headroom so bursts do not immediately OOMKill.
        controlledValues: RequestsAndLimits
