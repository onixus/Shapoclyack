# Its own account, not network-scan's `scanner`: a ServiceAccount is namespaced,
# and this one exists to carry no token (#338). The executor talks to the
# Shapoclyack API with an agent JWT, never to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
# The registry pull secret, as on network-scan's accounts (#339,
# base/serviceaccount.yaml). A Secret is namespaced: for a private registry,
# create `shapoclyack-registry` in network-scan-executor as well.
imagePullSecrets:
  - name: shapoclyack-registry
metadata:
  name: scanner-executor
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: scanner-executor
automountServiceAccountToken: false
