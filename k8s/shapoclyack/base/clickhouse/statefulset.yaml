apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shapoclyack-clickhouse
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: shapoclyack-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shapoclyack
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shapoclyack
        app.kubernetes.io/component: clickhouse
    spec:
      automountServiceAccountToken: false
      # Official image runs as uid 101 (clickhouse). Setting runAsUser here
      # (not just fsGroup) skips the image's root-bootstrap chown step, which
      # would otherwise fail under capabilities.drop: ALL below (no CAP_CHOWN).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            - name: interserver
              containerPort: 9009
          env:
            - name: CLICKHOUSE_DB
              value: shapoclyack
            - name: CLICKHOUSE_USER
              value: default
            # Read twice: by the image entrypoint, for the clickhouse-client
            # that runs the first-boot init.sql, and by users.xml through
            # `from_env`. Both must see the same value, which is why it is one
            # variable and not a password written into the ConfigMap.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-clickhouse
                  key: password
            # The entrypoint's generated users.d/default-user.xml is merged
            # before ours (alphabetical order in users.d), so users.xml wins
            # either way; keeping this at 0 means the two files agree instead
            # of relying on that ordering.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "0"
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          # No SYS_NICE any more (#338): it is outside Pod Security `baseline`,
          # which this namespace enforces, and all it bought was
          # `os_thread_priority`, a per-query setting nothing here sets. The
          # server logs that the capability is missing and carries on.
          #
          # Read-only image: the data, tmp and preprocessed-config paths are all
          # under /var/lib/clickhouse (the PVC; configmap.yaml). The image's
          # entrypoint writes two more places, both emptyDirs below — /tmp (it
          # copies users.xml there to diff it) and users.d (it generates
          # default-user.xml from CLICKHOUSE_PASSWORD). File logging is off in
          # configmap.yaml, so /var/log/clickhouse-server is not one of them.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/shapoclyack-config.xml
              subPath: config.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/shapoclyack-users.xml
              subPath: users.xml
              readOnly: true
            - name: config
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: shapoclyack-clickhouse-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Empty in the image (Dockerfile.alpine creates the directory and
        # nothing in it), so this hides nothing; shapoclyack-users.xml is
        # mounted into it above.
        - name: users-d
          emptyDir:
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
        labels:
          app.kubernetes.io/name: shapoclyack
          app.kubernetes.io/component: clickhouse
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
