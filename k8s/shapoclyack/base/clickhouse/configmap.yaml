apiVersion: v1
kind: ConfigMap
metadata:
  name: shapoclyack-clickhouse-config
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: clickhouse
data:
  # Keep defaults; override paths for StatefulSet PVC mounts.
  config.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>true</console>
      </logger>
      <path>/var/lib/clickhouse/</path>
      <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
      <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>
      <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>
      <display_name>shapoclyack-clickhouse</display_name>
      <listen_host>::</listen_host>
      <http_port>8123</http_port>
      <tcp_port>9000</tcp_port>
      <interserver_http_port>9009</interserver_http_port>
      <max_connections>4096</max_connections>
      <keep_alive_timeout>3</keep_alive_timeout>
      <max_concurrent_queries>100</max_concurrent_queries>
      <uncompressed_cache_size>8589934592</uncompressed_cache_size>
      <mark_cache_size>5368709120</mark_cache_size>
      <timezone>UTC</timezone>
      <mlock_executable>false</mlock_executable>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <users>
        <default>
          <!-- from_env reads CLICKHOUSE_PASSWORD, which statefulset.yaml wires
               to the shapoclyack-clickhouse Secret (secretGenerator in
               base/kustomization.yaml, same mechanism as Postgres). The
               entrypoint uses that same variable for the first-boot init.sql
               client, so the two can never drift apart.

               Do not put the password literally here: this file is a
               ConfigMap, readable by anything that can GET configmaps in the
               namespace.

               replace="replace" is required, not decorative: the image ships
               /etc/clickhouse-server/users.xml with <password></password>, and
               merging from_env onto an element that already has a value is a
               hard startup error ("has value and does not have 'replace'
               attribute"). Same for <networks> below, which would otherwise
               keep the image's ::/0 entry alongside ours. -->
          <password from_env="CLICKHOUSE_PASSWORD" replace="replace"/>
          <!-- Was ::/0 — every address on earth, which with a NodePort or a
               LoadBalancer in front of 8123 is exactly what it says. Private
               ranges are the widest set that is still correct on any CNI;
               narrow this to the actual pod CIDR in an overlay if you know it.
               The real boundary is the password above plus
               base/networkpolicy-datastores.yaml, since pod IPs live in these
               ranges too. -->
          <networks replace="replace">
            <ip>10.0.0.0/8</ip>
            <ip>172.16.0.0/12</ip>
            <ip>192.168.0.0/16</ip>
            <ip>127.0.0.1</ip>
            <ip>::1</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <!-- 0, not 1: the API only reads and inserts. With access_management
               on, anyone reaching 8123 with this account could CREATE USER and
               keep access across a password rotation. -->
          <access_management>0</access_management>
        </default>
      </users>
      <profiles>
        <default>
          <max_memory_usage>4000000000</max_memory_usage>
          <use_uncompressed_cache>0</use_uncompressed_cache>
          <load_balancing>in_order</load_balancing>
        </default>
      </profiles>
      <quotas>
        <default>
          <interval>
            <duration>3600</duration>
            <queries>0</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </default>
      </quotas>
    </clickhouse>
  # First-boot schema (mounted at /docker-entrypoint-initdb.d/init.sql).
  # Runs only when the data PVC is empty.
  init.sql: |
    CREATE DATABASE IF NOT EXISTS shapoclyack;

    CREATE TABLE IF NOT EXISTS shapoclyack.shapoclyack_vulnerabilities (
        tenant_id UUID,
        asset_ip IPv4,
        cve_id String,
        base_cvss Float32,
        epss_score Float32,
        asset_criticality UInt8,
        exploit_active UInt8,
        cisa_decision Enum8('Track' = 1, 'Attend' = 2, 'Act' = 3, 'Immediate' = 4),
        contextual_score Float32,
        scoring_model_version String,
        timestamp DateTime
    ) ENGINE = ReplacingMergeTree()
    ORDER BY (tenant_id, asset_ip, cve_id)
    TTL timestamp + INTERVAL 90 DAY;

    -- Port-state table (roadmap 3.3 keys: tenant_id, target_ip, port)
    CREATE TABLE IF NOT EXISTS shapoclyack.shapoclyack_open_ports (
        tenant_id UUID,
        target_ip IPv4,
        port UInt16,
        protocol LowCardinality(String),
        run_id String,
        timestamp DateTime
    ) ENGINE = ReplacingMergeTree()
    ORDER BY (tenant_id, target_ip, port)
    TTL timestamp + INTERVAL 90 DAY;

