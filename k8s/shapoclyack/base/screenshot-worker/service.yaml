# ClusterIP in network-scan. The executor (network-scan-executor) and the
# local-scan Jobs dial shapoclyack-screenshot-worker.network-scan.svc:8077.
apiVersion: v1
kind: Service
metadata:
  name: shapoclyack-screenshot-worker
  labels:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: screenshot-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shapoclyack
    app.kubernetes.io/component: screenshot-worker
  ports:
    - name: http
      port: 8077
      targetPort: http
