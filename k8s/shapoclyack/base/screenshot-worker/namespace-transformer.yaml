# network-scan for this component's Deployment, Service and NetworkPolicy,
# which are added after base's own namespace transformer has run. A copy of
# base/namespace-transformer.yaml, because a component may not load a file from
# outside its directory; unsetOnly for the reason given there (#338).
apiVersion: builtin
kind: NamespaceTransformer
metadata:
  name: network-scan-namespace
  namespace: network-scan
unsetOnly: true
