apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# network-scan for everything that does not name its own namespace — which is
# everything except scanner-executor/. Not the plain `namespace:` field: that
# one would move the executor into network-scan too, see the file (#338).
transformers:
  - namespace-transformer.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: shapoclyack
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  # NATS JetStream (message broker)
  - nats/configmap.yaml
  - nats/statefulset.yaml
  - nats/service.yaml
  # ClickHouse (analytics / raw ingest — Phase 3 consumer)
  - clickhouse/configmap.yaml
  - clickhouse/statefulset.yaml
  - clickhouse/service.yaml
  # Postgres (PRIMARY_DB — tenants + asset inventory, Phase 7)
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - backup
  - api-deployment.yaml
  - api-service.yaml
  - api-pdb.yaml
  - networkpolicy-datastores.yaml
  # Where scans run (#338): the sensor process, in its own namespace, holding
  # the raw-socket capabilities the API no longer has. The scan Job/CronJob
  # that used to be listed here need the same capabilities *inside*
  # network-scan (they share the scanner-data PVC with the API), which a
  # baseline namespace refuses; they moved to the opt-in local-scan/ component.
  - scanner-executor

configMapGenerator:
  - name: scanner-config
    files:
      - k8s.yaml=config/k8s.yaml
  # The same scanner config, for the executor: a pod mounts ConfigMaps from its
  # own namespace only. One source file for both, so the config the API
  # validates jobs against and the one the executor scans with cannot drift.
  - name: scanner-config
    namespace: network-scan-executor
    files:
      - k8s.yaml=config/k8s.yaml

secretGenerator:
  # Dev-only placeholders. The API refuses to start on this JWT secret unless
  # OCTO_ENV=dev (#155), so overriding it is enforced rather than merely
  # documented. The literal stays because removing it would make the
  # Deployment's secretKeyRef unresolvable — a kubelet CreateContainerConfigError
  # instead of a startup message that names the variable and how to fill it.
  - name: shapoclyack-api
    literals:
      - jwt_secret=shapoclyack-dev-secret-change-me
  - name: shapoclyack-postgres
    literals:
      - password=shapoclyack-dev-postgres-change-me
  # ClickHouse and NATS used to need no credentials at all, which meant any pod
  # in the cluster could read every tenant's scan results. Same placeholder
  # mechanism as Postgres above: the literal keeps secretKeyRef resolvable so a
  # fresh apply comes up, and docs/operations.md § Data-plane credentials is
  # where the rotation procedure lives.
  - name: shapoclyack-clickhouse
    literals:
      - password=shapoclyack-dev-clickhouse-change-me
  - name: shapoclyack-nats
    literals:
      - api_password=shapoclyack-dev-nats-api-change-me
      - agent_password=shapoclyack-dev-nats-agent-change-me
  # ClickHouse's `shapoclyack_backup` user (#333), read by the StatefulSet and
  # the backup CronJob. Generated like the three above so it always exists: the
  # server would otherwise define the user with an empty password.
  - name: shapoclyack-clickhouse-backup
    literals:
      - password=shapoclyack-dev-clickhouse-backup-change-me

generatorOptions:
  disableNameSuffixHash: true
