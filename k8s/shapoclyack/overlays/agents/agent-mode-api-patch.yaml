# NATS job dispatch on the API for the agents overlay. Agent execution mode
# itself is base's default since #338; the entry stays so this overlay says
# what it depends on even if base changes.
#
# The in-cluster executors keep claiming over HTTP (see
# base/scanner-executor/statefulset.yaml); the offers published here reach
# sensors outside the cluster that were given the `agent` NATS user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: OCTO_JOB_EXECUTION_MODE
              value: agent
            # Repeated from base/api-deployment.yaml on purpose: a strategic
            # merge puts this patch's env entries ahead of the base list, and
            # $(NATS_PASSWORD) only expands against a variable defined earlier.
            # Declaring it here keeps that true wherever the patch is applied.
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shapoclyack-nats
                  key: api_password
            - name: OCTO_NATS_URL
              value: nats://api:$(NATS_PASSWORD)@shapoclyack-nats-client:4222
            # NATS is configured now, so only ClickHouse stays declared unused
            # for the tenant purge (#325; base/api-deployment.yaml).
            - name: OCTO_TENANT_PURGE_UNUSED_STORES
              value: "clickhouse"
