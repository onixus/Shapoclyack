# Optional overlay: more scanner-executors, spread across zones/nodes, under a
# VPA, with the API publishing job offers on NATS.
#
#   kubectl apply -k k8s/shapoclyack/overlays/agents
#
# Since #338 base already runs the API in agent mode and one scanner-executor;
# this overlay is the fleet version of that, not the switch to it.
#
# Prerequisites:
#   - Secret shapoclyack-scanner-executor in network-scan-executor (the
#     provisioning key; docs/k8s-hardening.md § Enrolling the scanner-executor)
#   - VPA CRDs installed in the cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../base/agents

patches:
  - path: agent-mode-api-patch.yaml
  - path: replicas-patch.yaml
