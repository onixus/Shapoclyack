# Isolated restore-drill overlay (#158, #333).
#
# Same image and Postgres/API as kind-dev, in namespace shapoclyack-restore,
# without NodePort (so it does not steal :8080 from the source lab) and
# without NATS/the scanner-executor (ingress and external integrations stay
# off, as docs/disaster-recovery.md requires; a restored database must not
# start scanning). Postgres + API is the path scripts/restore-postgres.sh
# validates; ClickHouse stays so that scripts/restore-clickhouse.sh has a
# server to restore into (the API here has no OCTO_CLICKHOUSE_URL, as in base,
# so nothing ingests into it meanwhile).
#
# Neither backup CronJob runs here: a drill namespace that uploads into the
# production bucket and prefix would put drill data among the real restore
# points.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shapoclyack-restore

resources:
  - ../dev

images:
  - name: ghcr.io/onixus/shapoclyack-aio
    newTag: kind-dev
  # The one image the kind stand builds serves as the API image too, as in
  # overlays/kind-dev.
  - name: ghcr.io/onixus/shapoclyack-api
    newName: ghcr.io/onixus/shapoclyack-aio
    newTag: kind-dev

patches:
  - target:
      kind: Namespace
      name: network-scan
    patch: |-
      - op: replace
        path: /metadata/name
        value: shapoclyack-restore
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: shapoclyack-nats
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: shapoclyack-nats
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: shapoclyack-nats-client
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: shapoclyack-nats-config
      $patch: delete
  # The scanner-executor and its namespace (#338; the scan Job/CronJob it
  # replaced were deleted here before). One object per patch, as above.
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: shapoclyack-scanner-executor
        namespace: network-scan-executor
      $patch: delete
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: shapoclyack-scanner-executor
        namespace: network-scan-executor
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: shapoclyack-scanner-executor-ingress
        namespace: network-scan-executor
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: scanner-config
        namespace: network-scan-executor
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: scanner-executor
        namespace: network-scan-executor
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: network-scan-executor
      $patch: delete
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: shapoclyack-postgres-backup
      $patch: delete
  # A rehearsal next to the source lab on one kind node, not a sized
  # installation: base's 2 Gi request and 50 Gi claim are for the latter.
  - target:
      kind: StatefulSet
      name: shapoclyack-clickhouse
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: shapoclyack-clickhouse-backup
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: shapoclyack-clickhouse-backup-script
      $patch: delete
