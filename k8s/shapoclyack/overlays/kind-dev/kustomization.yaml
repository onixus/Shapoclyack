# Local kind cluster overlay — replaces `docker compose up --build` for dev.
# Loads locally-built images into the kind node (imagePullPolicy: IfNotPresent
# on all base manifests means kubelet won't try to pull once `kind load
# docker-image` has placed the tag on the node). See scripts/dev-up.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../dev

# The stand serves TLS, and the executor verifies it against the development
# CA scripts/dev-tls-cert.sh issues.
components:
  - ../../base/api-tls

patches:
  - path: api-service-nodeport-patch.yaml

# One locally built image for every workload: base's API image is the
# all-in-one without the scanners, so the all-in-one serves as both here
# rather than doubling the stand's slowest build step (scripts/dev-up.sh).
images:
  - name: ghcr.io/onixus/shapoclyack-aio
    newTag: kind-dev
  - name: ghcr.io/onixus/shapoclyack-api
    newName: ghcr.io/onixus/shapoclyack-aio
    newTag: kind-dev
