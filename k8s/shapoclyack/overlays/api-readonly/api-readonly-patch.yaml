apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapoclyack-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/onixus/shapoclyack-api:shapoclyack-0.46-0922@sha256:05f8a602511b5b0c6e04b29c503e5b77a793f4ea7abfc742044b08fd55357f2d
          env:
            - name: OCTO_ALLOW_SCAN_START
              value: "false"
            - name: OCTO_JOB_EXECUTION_MODE
              value: local
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Undoes base/local-scan's api-local-mode-patch.yaml, which this
          # overlay takes in only for the Job/CronJob (#338). `add: null`
          # deletes the list a strategic merge would otherwise keep.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add: null
          volumeMounts:
            - name: data
              mountPath: /app/scanner/output
              subPath: output
              readOnly: true
            - name: data
              mountPath: /app/scanner/state
              subPath: state
              readOnly: true
            - name: config
              mountPath: /app/scanner/config
              readOnly: true
