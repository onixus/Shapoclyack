# With at least two replicas there is finally something for a PDB to protect,
# so this reverses base/api-pdb.yaml's single-replica compromise (#335).
#
# `maxUnavailable: null` deletes the field the base sets. A PDB carrying both
# keys is rejected by the API server, and a strategic merge adds rather than
# replaces — so the deletion has to be explicit.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shapoclyack-api
spec:
  maxUnavailable: null
  # One replica must survive any voluntary disruption. At minReplicas: 2 this
  # still allows a drain (one pod may go), but it serialises them: two nodes
  # cannot be drained at the same time.
  minAvailable: 1
