# Peer routes between the three NATS pods (#335).
#
# base/networkpolicy-datastores.yaml is written for the single-pod NATS in
# base: it admits the API and in-cluster agents on 4222 and monitoring on 8222,
# and everything else is denied by omission. The route port 6222 is not in that
# list because nothing used it — with `replicas: 3` the servers have to reach
# each other on it, and under an enforcing CNI the cluster silently never
# forms: each pod logs route connection timeouts, JetStream elects no meta
# leader, and the API's readiness probe fails on the broker with no hint that
# a NetworkPolicy is the cause.
#
# `ingress` is an atomic list — a strategic merge REPLACES it wholesale rather
# than appending — so this is base's rule set plus the route rule, not a diff.
# Keep it in sync with base/networkpolicy-datastores.yaml if the NATS policy
# there changes. (Same trap as nats-ha-configmap-patch.yaml, for the same
# reason: Kubernetes has no per-item merge key here.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shapoclyack-nats-ingress
spec:
  ingress:
    # Copied from base: API clients and in-cluster agents on the client port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: 4222
    # Copied from base: the monitoring endpoint, open to whatever scrapes it.
    - ports:
        - protocol: TCP
          port: 8222
    # New here. The source is the NATS pods themselves and nobody else: a route
    # handshake joins the cluster and sees every subject regardless of the user
    # permissions in nats.conf, which is why the port is not simply opened
    # namespace-wide.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shapoclyack
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 6222
