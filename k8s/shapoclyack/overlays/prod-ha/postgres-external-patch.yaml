# External / managed Postgres: remove the in-cluster one (#335).
#
# base/postgres/statefulset.yaml is a single pod with a single PVC. Nothing
# about it is highly available — no replica, no failover, no automatic restore
# — so an HA profile that kept it would be claiming availability it does not
# have. The API's own connection is patched to a Secret-supplied URL in
# api-ha-patch.yaml; this file removes what that URL replaces.
#
# `$patch: delete` needs the full identity of the object (apiVersion, kind,
# name) and nothing else. See docs/high-availability.md § External Postgres for
# what has to exist on the other end: an RDS / Cloud SQL / CloudNativePG /
# Patroni cluster, the `octo` role, the `shapoclyack` database, and a
# `?sslmode=verify-full` URL in the Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shapoclyack-postgres
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: shapoclyack-postgres
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: shapoclyack-postgres-client
$patch: delete
---
# The ingress policy guarded pods that no longer exist. Leaving it would be
# harmless but misleading — it selects on the postgres component label, and a
# reader would take it as evidence that a database still lives here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shapoclyack-postgres-ingress
$patch: delete
---
# The nightly pg_dump is hard-wired to PGHOST=shapoclyack-postgres-client, the
# Service deleted above; kept, it would fail every night against a name that
# does not resolve. Backups move to the managed provider — snapshots + PITR on
# RDS/Cloud SQL, Barman on CloudNativePG — and so does the restore drill in
# docs/operations.md § Backup and disaster recovery. THIS IS A REAL LOSS OF
# FUNCTION, not a cleanup: an installation that applies this overlay and does
# not configure backups on the other side has no backups at all.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shapoclyack-postgres-backup
$patch: delete
---
# The dev placeholder password from base's secretGenerator. Nothing references
# it once api-ha-patch.yaml drops POSTGRES_PASSWORD from both containers, and
# leaving a credential named `shapoclyack-postgres` in the namespace of an
# install whose database is elsewhere is how the wrong one gets rotated.
apiVersion: v1
kind: Secret
metadata:
  name: shapoclyack-postgres
$patch: delete
