# Optional overlay: real GeoIP/EPSS/KEV/CVSS4 data on a shared RWX volume,
# refreshed daily by a CronJob, hot-reloaded by every API replica.
#
#   kubectl apply -k k8s/shapoclyack/overlays/enrichment
#
# Prerequisites:
#   - A StorageClass that supports ReadWriteMany (pvc.yaml has a commented
#     storageClassName field — set it to yours if the default class is RWO-only)
#   - Optional: Secret shapoclyack-geoip / key maxmind_license_key for the more
#     accurate MaxMind GeoLite2-City feed. Without it, GeoIP falls back
#     automatically to keyless DB-IP City Lite — no secret required to work.
#       kubectl create secret generic shapoclyack-geoip \
#         --from-literal=maxmind_license_key=<your-key> -n network-scan
#   - Optional: Secret shapoclyack-nvd / key nvd_api_key to raise NVD's rate
#     limit from 5 to 50 req/30s for the CVSS4 refresh. An unkeyed fetch is
#     slow enough to hit the job's activeDeadlineSeconds. Note this is separate
#     from the key stored via the config API — that one only reaches scan
#     processes, never the enrichment fetch.
#       kubectl create secret generic shapoclyack-nvd \
#         --from-literal=nvd_api_key=<your-key> -n network-scan
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../base/enrichment
