# An air-gapped installation (#339): every image from an internal registry,
# enrichment data from an offline bundle. docs/air-gap.md is the procedure;
# this is the shape of the overlay it ends with.
#
#   kubectl apply -k k8s/shapoclyack/overlays/airgap
#
# Copy it and change the placeholders:
#
#   1. `registry.internal.example` below → your registry. The images are
#      mirrored by digest (docs/air-gap.md, "Mirror the images"), and each
#      keeps the tag and digest the base pins through the rename (#313).
#      Leave the entries at newName: a `digest:` alone drops the tag, a
#      `newTag:` alone drops the digest.
#   2. The pull secret `shapoclyack-registry`: create it in network-scan
#      (docs/air-gap.md, "The pull secret"), or rename it — in the
#      ServiceAccounts (base) and in the pod-spec patches below alike.
#
# Every pod gets the secret declaratively: from its ServiceAccount (scanner,
# api, enrichment-bundle), or from its own pod spec through the patches below —
# the datastores, the backup CronJob and the online enrichment refresh run as
# the namespace's `default` account, which these manifests do not own and so do
# not patch. The pod-spec patches cover every workload kind, so a workload a
# later base adds is covered too; one that lands in another namespace needs the
# secret created there as well.
#
# Prerequisites are the enrichment overlay's (an RWX StorageClass for
# enrichment-data) plus an RWO class for the bundle inbox.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../base/enrichment
  - ../../base/enrichment-bundle

images:
  - name: ghcr.io/onixus/shapoclyack-aio
    newName: registry.internal.example/shapoclyack/shapoclyack-aio
  - name: postgres
    newName: registry.internal.example/library/postgres
  - name: nats
    newName: registry.internal.example/library/nats
  - name: clickhouse/clickhouse-server
    newName: registry.internal.example/clickhouse/clickhouse-server
  - name: amazon/aws-cli
    newName: registry.internal.example/amazon/aws-cli

patches:
  - target:
      kind: (Deployment|StatefulSet|DaemonSet|Job)
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: shapoclyack-registry
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/imagePullSecrets
        value:
          - name: shapoclyack-registry
  # To use a pull secret under another name, change the value in the two
  # patches above and add this one (every ServiceAccount in the render carries
  # exactly one entry):
  #
  # - target:
  #     kind: ServiceAccount
  #   patch: |-
  #     - op: replace
  #       path: /imagePullSecrets/0/name
  #       value: my-registry-credentials
