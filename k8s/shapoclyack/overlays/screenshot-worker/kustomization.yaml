# Opt-in browser runtime. Not part of base: the image is published only by
# Jenkinsfile.publish with ONLY=screenshot-worker and is never tagged :latest.
# Do not apply until base/screenshot-worker/deployment.yaml pins
# name:tag@sha256 of a publish that actually happened.
#
#   kubectl apply -k k8s/shapoclyack/overlays/screenshot-worker
#
# Set the same non-empty token in Secret shapoclyack-screenshot-worker (key
# token) in network-scan and network-scan-executor before enabling
# screenshots.enabled. An empty token refuses every capture.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../base/screenshot-worker
