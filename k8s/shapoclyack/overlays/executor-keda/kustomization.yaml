# Opt-in S2 executor autoscaling on queue depth (FTT-PULSE-2026-053, ADR 0011).
#
# Builds on overlays/agents (multi-replica StatefulSet + VPA) and adds a KEDA
# ScaledObject that drives an HPA from Prometheus gauges:
#   max(octo_jobs_shard_queued) and max(octo_jobs_queued).
#
# Prerequisites (NOT installed by this repository):
#   - KEDA CRDs / operator (https://keda.sh)
#   - A Prometheus that scrapes the API /metrics (ServiceMonitor or annotations)
#   - Secret shapoclyack-scanner-executor in network-scan-executor (enrollment)
#
# Before apply, replace PROMETHEUS_URL in scaledobject.yaml with the in-cluster
# Prometheus HTTP API (for example
# http://kube-prometheus-stack-prometheus.monitoring.svc:9090).
#
#   kubectl apply -k k8s/shapoclyack/overlays/executor-keda
#
# Clusters without KEDA must not use this overlay: apply fails with
# "no matches for kind ScaledObject". Hand-apply the same object from
# examples/executor-keda-scaledobject.example.yaml after editing the URL.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# unsetOnly: do not move scanner-executor out of network-scan-executor (#338).
transformers:
  - namespace-transformer.yaml

resources:
  - ../agents
  - scaledobject.yaml
